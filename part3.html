function smoothPath(coords, close){
  const p = coords.map(P);
  if(p.length<2) return "";
  if(p.length===2) return `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)} L ${p[1][0].toFixed(1)} ${p[1][1].toFixed(1)}`;
  let d = `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  const pts = close ? [...p, p[0], p[1]] : p;
  for(let i=0;i<pts.length-2;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  if(close) d += " Z";
  return d;
}

const LIVE_CATS={

function liveNote(html){ $("#live-map").innerHTML=`<div class="live-note">${html}</div>`; }
function initLiveMap(){
  if(LIVE.map){ setTimeout(()=>LIVE.map.invalidateSize(),50); startLocate(); return; }
  if(LIVE.failed || LIVE.loading) return;
  LIVE.loading=true;
  liveNote("Loading live map…");

  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");

  js.onload=()=>{ LIVE.loading=false; buildLiveMap(); };
  js.onerror=()=>{
    LIVE.loading=false; LIVE.failed=true;

      '<a href="https://nimblewizard.github.io/pathseeker/" target="_blank" rel="noopener"><b>Open Pathseeker on the web ↗</b></a>');
  };
  document.head.appendChild(js);
}
function buildLiveMap(){
  const el=$("#live-map"); el.innerHTML="";
  LIVE.map=L.map(el,{zoomControl:true}).setView([42.5,12.5],6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:'© OpenStreetMap contributors'}).addTo(LIVE.map);
  /* trip stops */
  const seq=[S.trip.arrivalCity, ...sortedStops().map(s=>s.cityId), S.trip.departureCity];
  const pts=[];
  [...new Set(seq)].forEach(id=>{
    const c=CITY_BY_ID[id]; if(!c||!c.lat) return;
    pts.push([c.lat,c.lon]);
    L.circleMarker([c.lat,c.lon],{radius:8,color:"#F3E7C9",weight:2,fillColor:"#BE1E3C",fillOpacity:1})
      .addTo(LIVE.map).bindPopup(`<b>${esc(c.n)}</b><br><a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`);
  });
  if(pts.length>1){
    L.polyline(pts,{color:"#C8202F",weight:3,dashArray:"8 7",opacity:.85}).addTo(LIVE.map);
    LIVE.map.fitBounds(pts,{padding:[40,40]});
  }
  LIVE.poiLayer=L.layerGroup().addTo(LIVE.map);
  const btn=document.createElement("button");
  btn.className="live-locate"; btn.textContent="📍"; btn.title="Go to my location";
  btn.addEventListener("click",()=>{ startLocate(true); });
  el.appendChild(btn);
  LIVE.map.on("popupopen",()=>{ LIVE.reading=true; });
  LIVE.map.on("popupclose",()=>{ LIVE.reading=false; });
  LIVE.map.on("moveend",()=>{
    if(LIVE.reading) return;   /* don't wipe the markers out from under an open popup */
    clearTimeout(LIVE.fetchTimer); LIVE.fetchTimer=setTimeout(fetchPOIs,700);
  });
  startLocate(false);   /* show the blue dot quietly — never yank the view away from Italy */
}
function startLocate(fly){
  if(!navigator.geolocation||!LIVE.map) return;
  if(LIVE.watch===null){
    LIVE.watch=navigator.geolocation.watchPosition(p=>{
      const ll=[p.coords.latitude,p.coords.longitude];
      if(!LIVE.meDot){
        LIVE.meRing=L.circle(ll,{radius:p.coords.accuracy||30,color:"#2E6BB8",weight:1,fillColor:"#2E6BB8",fillOpacity:.12}).addTo(LIVE.map);
        LIVE.meDot=L.circleMarker(ll,{radius:7,color:"#fff",weight:2.5,fillColor:"#2E6BB8",fillOpacity:1})
          .addTo(LIVE.map).bindPopup("You are here");
        if(fly===true) LIVE.map.flyTo(ll,15);
      }else{
        LIVE.meDot.setLatLng(ll); LIVE.meRing.setLatLng(ll).setRadius(p.coords.accuracy||30);
      }
    },()=>{},{enableHighAccuracy:true,maximumAge:15000});
  }else if(fly && LIVE.meDot){ LIVE.map.flyTo(LIVE.meDot.getLatLng(),15); }
}
const OVERPASS_URLS=["https://overpass-api.de/api/interpreter",
                     "https://overpass.openstreetmap.fr/api/interpreter",
                     "https://overpass.kumi.systems/api/interpreter",
                     "https://overpass.osm.jp/api/interpreter",
                     "https://overpass.private.coffee/api/interpreter"];
function fetchPOIs(){
  if(!LIVE.map||!LIVE.cat) return;
  if(LIVE.reading) return;   /* never redraw markers while the user is reading a popup */
  if(LIVE.map.getZoom()<13){
    $("#map-hint").innerHTML=`Zoom in closer to see ${esc(LIVE_CATS[LIVE.cat].label.toLowerCase())} · map data © OpenStreetMap contributors`;
    LIVE.poiLayer.clearLayers(); return;
  }
  const b=LIVE.map.getBounds(), key=LIVE.cat, cat=LIVE_CATS[key];
  const bbox=`(${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()})`;
  const q=`[out:json][timeout:15];(node${cat.q}${bbox};way${cat.q}${bbox};);out center 150;`;
  $("#map-hint").textContent="Searching this area…";
  /* hard client timeout — the public mirrors sometimes accept a request and then stall */
  const ac=new AbortController();
  const killer=setTimeout(()=>ac.abort(),15000);
  fetch(OVERPASS_URLS[LIVE.ep||0],{method:"POST",body:"data="+encodeURIComponent(q),
    headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ac.signal})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .finally(()=>clearTimeout(killer))
    .then(d=>{
      if(LIVE.cat!==key) return;  // filter changed while the request was in flight
      LIVE.poiLayer.clearLayers();
      let n=0;
      (d.elements||[]).forEach(e=>{
        const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
        if(lat==null) return;
        const t=e.tags||{}, name=t.name||cat.label;
        /* everything the open data knows about the place */
        const phone=t.phone||t["contact:phone"], site=t.website||t["contact:website"];
        const info=[
          t.cuisine? `🍴 ${esc(t.cuisine.replace(/_/g," ").replace(/;/g,", "))}` : "",
          (t["addr:street"]||t["addr:housenumber"])? `📍 ${esc([t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "))}` : "",
          t.opening_hours? `🕐 ${esc(t.opening_hours)}` : "",
          t.stars? `✦ ${esc(t.stars)}-star` : "",
          phone? `<a href="tel:${esc(phone.replace(/\s/g,""))}">📞 ${esc(phone)}</a>` : "",
          site? `<a href="${esc(site)}" target="_blank" rel="noopener">🌐 Website ↗</a>` : "",
        ].filter(Boolean).join("<br>");
        const gq=encodeURIComponent(t.name? `${t.name} ${lat},${lon}` : `${lat},${lon}`);
        L.circleMarker([lat,lon],{radius:6,color:"#fff",weight:1.5,fillColor:cat.col,fillOpacity:.92})
          .addTo(LIVE.poiLayer)
          .bindPopup(`<b>${esc(name)}</b><br><span style="opacity:.75">${esc(LIVE.cat)}</span>`+
            (info?`<br>${info}`:"")+
            `<br><a href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">📷 Photos &amp; reviews ↗</a>`);
        n++;
      });
      LIVE.tries=0;
      $("#map-hint").innerHTML=`${n} ${esc(cat.label.toLowerCase())} in view${n>=150?" (max shown)":""} · map data © OpenStreetMap contributors`;
    })
    .catch(()=>{
      /* rotate to a mirror and retry — the public Overpass servers rate-limit freely */
      LIVE.ep=((LIVE.ep||0)+1)%OVERPASS_URLS.length;
      LIVE.tries=(LIVE.tries||0)+1;
      if(LIVE.tries<OVERPASS_URLS.length){
        $("#map-hint").textContent="Nearby search hiccup — trying another server…";
        setTimeout(()=>{ if(LIVE.cat===key) fetchPOIs(); },1200);
      }else{
        LIVE.tries=0;
        $("#map-hint").textContent="Nearby search failed — pan the map to try again.";
      }
    });
}
function wireLiveFilter(){
  $$("#live-filter .chip").forEach(ch=>ch.addEventListener("click",()=>{
    const cat=ch.dataset.live;
    LIVE.cat = (LIVE.cat===cat)? null : cat;
    LIVE.tries=0;
    $$("#live-filter .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.live===LIVE.cat)));
    if(LIVE.poiLayer) LIVE.poiLayer.clearLayers();
    if(!LIVE.cat){
      $("#map-hint").innerHTML='map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
      return;
    }
    if(LIVE.map){
      /* the Nearby filters are about the TRIP — find the stop closest to the current view.
         If the view is far from the whole route (e.g. browsing from home in Colorado),
         or just zoomed out, fly to that Italian stop instead of searching locally. */
      const c=LIVE.map.getCenter();
      let best=null, bd=Infinity;
      [S.trip.arrivalCity, ...sortedStops().map(s=>s.cityId), S.trip.departureCity].forEach(id=>{
        const ct=CITY_BY_ID[id]; if(!ct||!ct.lat) return;
        const d=(ct.lat-c.lat)**2+(ct.lon-c.lng)**2;
        if(d<bd){ bd=d; best=[ct.lat,ct.lon]; }
      });
      const farKm = Math.sqrt(bd)*111;   /* rough degrees → km */
      if(best && (LIVE.map.getZoom()<13 || farKm>150)){
        LIVE.map.flyTo(best,15);         /* moveend triggers the search on arrival */
        return;
      }
    }
    fetchPOIs();
  }));
}

function panToCity(id){
  const c=CITY_BY_ID[id]; if(!c||!mapSvg) return;
  const [x,y]=ART[c.id]||[MAP_W/2,MAP_H/2];
  VB.x=x-VB.w/2-marginShift(); VB.y=y-VB.h/2; applyVB();
}

function el(tag, attrs, parent){
  const e=document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function buildMapInto(container, interactive){
  const svg = el("svg", {viewBox:`0 0 ${MAP_W} ${MAP_H}`, preserveAspectRatio:"xMidYMid meet"});
  /* no backdrop rect — the stage's parchment desk (BG_MAPDESK) shows around the map */
  const img = el("image",{x:0,y:0,width:MAP_W,height:MAP_H,preserveAspectRatio:"none"},svg);
  img.setAttribute("href", MAP_IMG);
  img.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href", MAP_IMG);
  if(interactive) mapImgEl=img;
  container.appendChild(svg);
  return svg;
}
function marginShift(w,h){
  /* the stage runs under the painted margin, so plain centring would bury art behind it.
     Convert half the margin's width into art units at the given zoom level. */
  if(!mapSvg) return 0;
  const st=mapSvg.getBoundingClientRect();
  if(!st.width || window.innerWidth<=820) return 0;
  const margin=parseFloat(getComputedStyle($("#view-map")).getPropertyValue("--margin-w"))||0;
  const scale=Math.min(st.width/(w||VB.w), st.height/(h||VB.h));   /* xMidYMid meet */
  return scale ? (margin/2)/scale : 0;
}
function fitVB(){ VB={x:-marginShift(CURW,CURH),y:0,w:CURW,h:CURH}; applyVB(); }
/* the first fit can run before the stage has been laid out (width 0 → no shift),
   so re-fit whenever the map is revealed or resized — but never fight a user's zoom */
function refitMap(){ if(mapSvg && Math.abs(VB.w-CURW)<1) fitVB(); }
function applyVB(){ mapSvg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }
function zoomAt(cx, cy, f){
  const w=Math.min(Math.max(VB.w*f, 180), CURW*1.6);
  const s=w/VB.w;
  VB.x = cx-(cx-VB.x)*s; VB.y = cy-(cy-VB.y)*s; VB.w=w; VB.h=VB.h*s;
  applyVB();
}
function clientToMap(x,y){
  const r=mapSvg.getBoundingClientRect();
  const scale=Math.max(VB.w/r.width, VB.h/r.height);
  const ox=(r.width - VB.w/scale)/2, oy=(r.height - VB.h/scale)/2;
  return [VB.x+(x-r.left-ox)*scale, VB.y+(y-r.top-oy)*scale];
}
function initMap(){
  const stage=$("#map-stage");
  mapSvg = buildMapInto(stage, true);
  routeDoneEl = el("path",{class:"route-done",d:""},mapSvg);
  routeEl = el("path",{class:"route",d:""},mapSvg);
  cityLayer = el("g",{},mapSvg);
  for(const c of CITIES){
    const [x,y]=ART[c.id]||[MAP_W/2,MAP_H/2];
    const g=el("g",{class:"city","data-city":c.id,transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`,
      tabindex:"0",role:"button"},cityLayer);
    g.setAttribute("aria-label", c.n);
    el("circle",{class:"halo",r:24},g);
    el("circle",{class:"dot",r:11},g);
    if(!ART_LABELED.has(c.id)){
      const left = LBL_LEFT.has(c.id);
      const t=el("text",{x:left?-20:20,y:8,"text-anchor":left?"end":"start"},g);
      t.textContent=c.n;
    }
    g.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();selectCity(c.id);} });
  }
  /* City taps are resolved from the stage click, not per-marker listeners: the pan handler's
     setPointerCapture redirects the composed click to the svg, so g-level click never fires. */
  const ptrs=new Map(); let panStart=null, pinchStart=null, moved=false;
  let downCity=null, downOnMap=false;
  stage.addEventListener("click",()=>{
    if(!downOnMap) return;      /* began on HUD chrome (chips, zoom), not the map */
    downOnMap=false;
    if(moved) return;           /* it was a pan/pinch */
    selectCity(downCity); downCity=null;
  });
  mapSvg.addEventListener("pointerdown",(e)=>{
    mapSvg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,[e.clientX,e.clientY]); moved=false;
    downOnMap=true;
    const cg = e.target && e.target.closest ? e.target.closest(".city") : null;
    downCity = cg ? cg.dataset.city : null;
    if(ptrs.size===1) panStart={x:e.clientX,y:e.clientY,vb:{...VB}};
    if(ptrs.size===2){ const a=[...ptrs.values()]; pinchStart={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),vb:{...VB},
      mid:clientToMap((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2)}; panStart=null; }
  });
  mapSvg.addEventListener("pointermove",(e)=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1 && panStart){
      const r=mapSvg.getBoundingClientRect();
      const scale=Math.max(VB.w/r.width, VB.h/r.height);
      const dx=(e.clientX-panStart.x)*scale, dy=(e.clientY-panStart.y)*scale;
      if(Math.abs(e.clientX-panStart.x)+Math.abs(e.clientY-panStart.y)>4) moved=true;
      VB.x=panStart.vb.x-dx; VB.y=panStart.vb.y-dy; applyVB(); hideHint();
    }else if(ptrs.size===2 && pinchStart){
      const a=[...ptrs.values()];
      const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      const f=pinchStart.d/Math.max(1,d);
      VB={...pinchStart.vb}; zoomAt(pinchStart.mid[0],pinchStart.mid[1],f); hideHint();
    }
  });
  const up=(e)=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchStart=null; if(ptrs.size<1) panStart=null; };
  mapSvg.addEventListener("pointerup",up); mapSvg.addEventListener("pointercancel",up);
  mapSvg.addEventListener("wheel",(e)=>{
    e.preventDefault();
    const [mx,my]=clientToMap(e.clientX,e.clientY);
    zoomAt(mx,my, e.deltaY>0?1.12:0.89); hideHint();
  },{passive:false});
  $("#zoom-in").addEventListener("click",()=> zoomAt(VB.x+VB.w/2,VB.y+VB.h/2,0.7));
  $("#zoom-out").addEventListener("click",()=> zoomAt(VB.x+VB.w/2,VB.y+VB.h/2,1.4));
  /* practical-map switcher */
  const sw=$("#map-switch");
  XMAPS.forEach(m=>{
    const b=document.createElement("button");
    b.className="chip"; b.dataset.xmap=m.id; b.textContent=m.n;
    b.setAttribute("aria-pressed", String(m.id==="story"));
    b.addEventListener("click",()=>showXMap(m.id));
    sw.appendChild(b);
  });
  UI.xmap="story";
  $("#zoom-reset").addEventListener("click",fitVB);
  const stepDay=(n)=>{
    UI.focusDay=clampDay(addD(focusDayClamped(),n));
    updateMapMarks();
    const c=(stopsOn(focusDayClamped())[0]||{}).cityId;
    if(c) panToCity(c);
  };
  $("#ds-prev").addEventListener("click",()=>stepDay(-1));
  $("#ds-next").addEventListener("click",()=>stepDay(1));
  applyVB();
  updateMapMarks();
}
function hideHint(){
  if(UI.xmap && UI.xmap!=="story") return; /* keep credit + official links visible */
  if(!UI.hintShown){UI.hintShown=true; $("#map-hint").classList.add("hidden");}
}
function updateMapMarks(){
  if(!mapSvg) return;   /* main map not built yet (e.g. loading a snapshot from the home screen) */
  const f = S.trip.begun ? focusDayClamped() : null;
  $$(".city").forEach(g=>{
    const id=g.dataset.city;
    const st=stopFor(id);
    g.classList.toggle("in-trip", !!st);
    g.classList.toggle("selected", UI.selected===id);
    let visited=false, current=false;
    if(f && st){
      const out=addD(st.arrive, Math.max(0,st.nights-1||0));
      current = f>=st.arrive && f<=out;
      visited = f>out;
    }
    g.classList.toggle("visited", visited && !current);
    g.classList.toggle("current", current);
    const gw = id===S.trip.arrivalCity || id===S.trip.departureCity;
    g.classList.toggle("gateway", gw);
    let pl=g.querySelector(".plane");
    if(gw && !pl){ pl=el("text",{class:"plane",y:-20,x:0,"text-anchor":"middle"},g); pl.textContent="✈"; }
    if(!gw && pl) pl.remove();
    /* photo count badge */
    const n=PHOTOS.filter(p=>p.cityId===id).length;
    let pb=g.querySelector(".pbadge");
    if(n){
      if(!pb){
        pb=el("g",{class:"pbadge",transform:"translate(20 -20)"},g);
        el("circle",{r:14},pb);
        el("text",{y:7,"text-anchor":"middle"},pb);
      }
      pb.querySelector("text").textContent = n>9? "9+" : n;
    }else if(pb) pb.remove();
  });
  /* route, split into traveled + ahead when trip mode is on */
  const seq=[];
  const push=(id,d)=>{ if(id && CITY_BY_ID[id] && (!seq.length || seq[seq.length-1].id!==id)) seq.push({id,d}); };
  push(S.trip.arrivalCity, S.trip.startDate);
  sortedStops().forEach(s=>push(s.cityId, s.arrive));
  push(S.trip.departureCity, S.trip.endDate);
  if(seq.length>1){
    const pts=seq.map(s=>ART[s.id]);
    if(f){
      let k=0;
      for(let i=0;i<seq.length;i++) if(seq[i].d<=f) k=i;
      routeDoneEl.setAttribute("d", k>0? smoothPath(pts.slice(0,k+1),false) : "");
      routeEl.setAttribute("d", k<seq.length-1? smoothPath(pts.slice(k),false) : "");
    }else{
      routeDoneEl.setAttribute("d","");
      routeEl.setAttribute("d", smoothPath(pts,false));
    }
  }else{ routeEl.setAttribute("d",""); routeDoneEl.setAttribute("d",""); }
  /* day scrubber */
  const ds=$("#day-scrub");
  if(S.trip.begun && S.trip.stops.length){
    ds.classList.remove("hidden");
    const t=focusDayClamped(), days=tripDays(), n=days.indexOf(t)+1;
    const cid=(stopsOn(t)[0]||{}).cityId;
    $("#ds-label").textContent=`Day ${n||"–"} · ${cid? CITY_BY_ID[cid].n : fmtShort(t)}`;
    $("#ds-prev").disabled = t<=S.trip.startDate;
    $("#ds-next").disabled = t>=S.trip.endDate;
  }else ds.classList.add("hidden");
}

  const c=CITY_BY_ID[cityId], st=stopFor(cityId);
  $("#dlg-dates-title").textContent = st? `Dates in ${c.n}` : `Nights in ${c.n}`;
  $("#dlg-dates-sub").textContent = `Trip window: ${fmtShort(S.trip.startDate)} – ${fmtShort(S.trip.endDate)}`;
  let defArrive = S.trip.startDate;
  const ss=sortedStops();
  if(ss.length && !st){ const last=ss[ss.length-1]; defArrive=addD(last.arrive, Math.max(1,last.nights)); }
  if(defArrive>S.trip.endDate) defArrive=S.trip.endDate;
  $("#stop-arrive").value = st? st.arrive : defArrive;
  $("#stop-nights").value = st? st.nights : 2;
  $("#stop-remove").classList.toggle("hidden", !st);
  $("#stop-ok").textContent = st? "Save dates" : "Add to trip";
  updStopNote();
  $("#dlg-dates").returnValue="";
  $("#dlg-dates").showModal();
}
function updStopNote(){
  const a=$("#stop-arrive").value, n=+$("#stop-nights").value||0;
  if(!a){ $("#stop-note").textContent=""; return; }
  let msg=`${fmtShort(a)} → check out ${fmtShort(addD(a,n))}`;
  if(a<S.trip.startDate || addD(a,n)>S.trip.endDate) msg+=" · ⚠ outside your trip dates";
  const clash=stopsOn(a).find(s=>s.cityId!==stopCity);
  if(clash) msg+=` · overlaps ${CITY_BY_ID[clash.cityId].n}`;
  $("#stop-note").textContent=msg;
}
function initStopDlg(){
  $("#stop-arrive").addEventListener("input",updStopNote);
  $("#stop-nights").addEventListener("input",updStopNote);
  $("#dlg-dates").addEventListener("close",()=>{
    const v=$("#dlg-dates").returnValue;
    if(v==="ok"){
      const a=$("#stop-arrive").value, n=Math.max(0,+$("#stop-nights").value||0);
      if(!a){ toast("Pick an arrival date"); return; }
      const st=stopFor(stopCity);
      if(st){ st.arrive=a; st.nights=n; toast(`${CITY_BY_ID[stopCity].n} updated`); }
      else { S.trip.stops.push({id:uid(), cityId:stopCity, arrive:a, nights:n}); toast(`${CITY_BY_ID[stopCity].n} added to your route`); }
      mutate(); renderAll();
    }else if(v==="remove"){
      const gone=stopFor(stopCity);
      S.trip.stops=S.trip.stops.filter(s=>s.cityId!==stopCity);
      mutate(); renderAll();
      if(gone) trashPut("stop", gone, CITY_BY_ID[stopCity].n+" stop");
    }
  });
}

/* ---- undo & trash: nothing deleted is gone until you say so ---- */
function trashPut(kind, data, label){
  S.trash=S.trash||[];
  const entry={id:uid(), kind, label, at:new Date().toISOString(), data};
  S.trash.unshift(entry);
  if(S.trash.length>20) S.trash.length=20;
  persist();
  undoToast(`Deleted “${label}”`, entry.id);
}
function trashRestore(id){
  const t=(S.trash||[]).find(x=>x.id===id); if(!t) return;
  S.trash=S.trash.filter(x=>x.id!==id);
  if(t.kind==="booking") S.trip.bookings.push(t.data);
  else if(t.kind==="expense") S.trip.expenses.push(t.data);
  else if(t.kind==="note") S.trip.journal.push(t.data);
  else if(t.kind==="stop" && !stopFor(t.data.cityId)) S.trip.stops.push(t.data);
  else if(t.kind==="idea") (S.trip.shortlist=S.trip.shortlist||[]).push(t.data);
  mutate(); renderAll();
  toast(`Restored “${t.label}”`);
}
function undoToast(msg, trashId){
  const t=$("#toast");
  t.innerHTML=`${esc(msg)} <button class="toast-undo" type="button">Undo</button>`;
  t.querySelector(".toast-undo").addEventListener("click",()=>{ t.classList.remove("show"); trashRestore(trashId); });
  t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 6500);
}

/* ================= TRIP CALENDAR — the whole trip on a month grid ================= */
function calMonths(){
  const out=[], seen=new Set();
  tripDays().forEach(d=>{ const k=d.slice(0,7); if(!seen.has(k)){ seen.add(k); out.push(k); } });
  return out;
}
function calDayCell(d, inMonth){
  const days=tripDays();
  const hasBk=d && S.trip.bookings.some(b=>b.date===d);
  const inTrip=days.includes(d) || hasBk;   /* travel days outside the window still count */
  const st=stopsOn(d), city=st[0]?CITY_BY_ID[st[0].cityId]:null;
  const arriving=sortedStops().filter(s=>s.arrive===d);
  const prevCity=d>S.trip.startDate ? (stopsOn(addD(d,-1))[0]||{}).cityId : null;
  const moving=arriving.length && prevCity && prevCity!==arriving[0].cityId;
  const bks=S.trip.bookings.filter(b=>b.date===d).sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1);
  const notes=S.trip.journal.filter(j=>j.date===d).length;
  const isToday=d===todayISO();
  const n=+d.slice(8,10);
  if(!inMonth) return `<div class="cal-cell out"></div>`;
  return `<div class="cal-cell${inTrip?" trip":""}${isToday?" today":""}${moving?" moving":""}"
      ${inTrip?`data-calday="${d}" role="button" tabindex="0" aria-label="${fmtDow(d)} ${fmtShort(d)}"`:""}>
    <div class="cal-num">${n}${d===S.trip.startDate?' <span class="cal-flag">✈ in</span>':""}${d===S.trip.endDate?' <span class="cal-flag">✈ home</span>':""}</div>
    ${city?`<div class="cal-city">${moving?"→ ":""}${esc(city.short||city.n)}</div>`
      :(hasBk&&!days.includes(d))?`<div class="cal-city none">✈ travel</div>`
      :inTrip?`<div class="cal-city none">—</div>`:""}
    ${bks.length?`<div class="cal-dots">${bks.slice(0,4).map(b=>
      `<span class="cal-dot" style="background:${typeMeta(b.type).c}" title="${esc(b.name)}"></span>`).join("")}${
      bks.length>4?`<span class="cal-more">+${bks.length-4}</span>`:""}</div>`:""}
    ${notes?`<div class="cal-note">✎${notes>1?notes:""}</div>`:""}
  </div>`;
}
function calendarHtml(){
  const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  return calMonths().map(mk=>{
    const [y,m]=mk.split("-").map(Number);
    const first=new Date(y,m-1,1), last=new Date(y,m,0);
    const lead=(first.getDay()+6)%7;   /* Monday-first, the Italian way */
    let cells="";
    for(let i=0;i<lead;i++) cells+=calDayCell("",false);
    for(let day=1;day<=last.getDate();day++)
      cells+=calDayCell(`${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`,true);
    const tail=(7-((lead+last.getDate())%7))%7;
    for(let i=0;i<tail;i++) cells+=calDayCell("",false);
    return `<div class="cal-month">
      <h3 class="cal-title serif">${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</h3>
      <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
    </div>`;
  }).join("");
}

/* ================= TRIP VERSIONS — save alternates, compare costs & travel ================= */
function tripStats(trip){
  const stops=[...(trip.stops||[])].sort((a,b)=>a.arrive<b.arrive?-1:1);
  const seq=[]; const push=(id)=>{ if(id&&CITY_BY_ID[id]&&(!seq.length||seq[seq.length-1]!==id)) seq.push(id); };
  push(trip.arrivalCity); stops.forEach(s=>push(s.cityId)); push(trip.departureCity);
  const legs=[];
  for(let i=1;i<seq.length;i++){
    const tt=travelInfo(seq[i-1],seq[i])||"", mode=legMode(tt);
    const m=tt.match(/(\d+)h(\d+)?/), mm=tt.match(/~?(\d+)\s?m/);
    legs.push({mode, h: m? (+m[1]+(m[2]?+m[2]/60:0)) : mm? +mm[1]/60 : 0});
  }
  const sum=(f)=>legs.filter(f).reduce((a,l)=>a+l.h,0);
  /* committed € — variant-aware rerun of the pipeline logic */
  const findBk=(item)=>{
    if(item.stay) return (trip.bookings||[]).find(b=>(b.type==="hotel"||b.type==="airbnb")&&b.cityId===item.stay);
    const mt=item.match; if(!mt) return null;
    const k=mt.kw? new RegExp(mt.kw,"i") : null;
    return (trip.bookings||[]).find(b=>b.conf&&(!mt.type||b.type===mt.type)&&(!mt.city||b.cityId===mt.city)&&(!k||k.test(b.name+" "+(b.notes||""))));
  };
  let committed=0;
  CHECKLIST.forEach(item=>{
    const raw=trip.checklist&&trip.checklist[item.id];
    const o=raw===true?{st:"booked"}:(raw&&typeof raw==="object"?raw:{});
    const bk=findBk(item);
    const st=(bk&&o.st!=="paid")?"booked":(o.st||"todo");
    if(st==="booked"||st==="paid") committed += (o.pr!=null&&o.pr!=="")? +o.pr : priceNum(bk&&bk.price);
  });
  /* rough lodging estimate from each city's stay price bands (€/night midpoints) */
  const BAND={1:95,2:170,3:280};
  let lodging=0;
  stops.forEach(s=>{
    const c=CITY_BY_ID[s.cityId]; if(!c) return;
    const ps=(c.pois||[]).filter(p=>p.c==="stay"&&p.p).map(p=>p.p).sort((a,b)=>a-b);
    const band=ps.length? ps[Math.floor(ps.length/2)] : 2;
    lodging += (+s.nights||0)*BAND[band];
  });
  return { names:seq.map(id=>CITY_BY_ID[id].short||CITY_BY_ID[id].n),
    stopCount:stops.length, nights:stops.reduce((a,s)=>a+(+s.nights||0),0),
    legCount:legs.length, totalH:sum(()=>true), carH:sum(l=>l.mode==="car"),
    trainH:sum(l=>l.mode==="train"), ferryH:sum(l=>l.mode==="ferry"),
    maxLegH:legs.reduce((a,l)=>Math.max(a,l.h),0),
    committed:Math.round(committed), lodging:Math.round(lodging) };
}
const fmtH=(h)=>{ if(!h) return "—";
  const m=Math.round(h%1*60);
  return h>=1? `${Math.floor(h)}h${m?String(m).padStart(2,"0"):""}` : `${Math.round(h*60)}m`; };
function saveVariant(name){
  S.variants=S.variants||[];
  if(S.variants.length>=8){ toast("Eight versions is plenty — delete one first"); return; }
  S.variants.push({id:uid(), name, savedAt:todayISO(), trip:JSON.parse(JSON.stringify(S.trip))});
  mutate(); renderItin(); toast(`Saved "${name}"`);
}
function loadVariant(id){
  const v=(S.variants||[]).find(x=>x.id===id); if(!v) return;
  S.variants=S.variants.filter(x=>x.name!=="Auto-backup");
  S.variants.push({id:uid(), name:"Auto-backup", savedAt:todayISO(), trip:JSON.parse(JSON.stringify(S.trip))});
  S.trip=Object.assign(DEFAULT_TRIP(), JSON.parse(JSON.stringify(v.trip)));
  mutate(); renderAll(); renderHome();
  toast(`Loaded "${v.name}" — your previous route is in Auto-backup`);
}
function versionsHtml(){

}
function openCompare(){
  const cols=[{name:"Current", st:tripStats(S.trip)},
    ...(S.variants||[]).map(v=>({name:v.name, st:tripStats(v.trip)}))];
  const rows=[
    {l:"Route", v:c=>c.st.names.join(" → ")},
    {l:"Stops", v:c=>c.st.stopCount},
    {l:"Nights placed", v:c=>c.st.nights},
    {l:"Travel legs", v:c=>c.st.legCount},
    {l:"Total travel", v:c=>fmtH(c.st.totalH), n:c=>c.st.totalH, best:"min"},
    {l:"Driving", v:c=>fmtH(c.st.carH), n:c=>c.st.carH, best:"min"},
    {l:"Train time", v:c=>fmtH(c.st.trainH), n:c=>c.st.trainH, best:"min"},
    {l:"Longest single leg", v:c=>fmtH(c.st.maxLegH), n:c=>c.st.maxLegH, best:"min"},
    {l:"Committed so far", v:c=>c.st.committed?money0(c.st.committed):"—"},
    {l:"Rough lodging est.", v:c=>"~"+money0(c.st.lodging), n:c=>c.st.lodging, best:"min"},
  ];
  let h=`<table class="cmp-table"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(r=>{
    let bestIdx=-1;
    if(r.best && cols.length>1){
      const vals=cols.map(r.n);
      const pos=vals.filter(v=>v>0);
      const target=Math.min(...pos);
      /* only crown a winner when there's an actual difference */
      if(isFinite(target) && Math.max(...pos)>target) bestIdx=vals.indexOf(target);
    }
    h+=`<tr><th>${r.l}</th>${cols.map((c,i)=>
      `<td class="${i===bestIdx?"best":""}">${r.v(c)}${i===bestIdx?" ✓":""}</td>`).join("")}</tr>`;
  });
  h+=`</tbody></table>
    <p class="times-note">Lodging estimate = nights × each town's typical price band (~€95/€170/€280 a night) —
    a planning yardstick, not a quote. Committed = prices logged in the Travel agent pipeline of that version.</p>`;
  $("#cmp-body").innerHTML=h;
  const dlg=$("#dlg-compare"); dlg.returnValue=""; dlg.showModal();
}

}

function rechain(seq, from){
  for(let j=Math.max(1,from); j<seq.length; j++)
    seq[j].arrive = addD(seq[j-1].arrive, Math.max(1, +seq[j-1].nights||1));
}
function wireStopEditor(wrap){
  wrap.querySelectorAll(".stop-card").forEach(card=>{
    const sid=card.dataset.sid;
    const seq=()=>sortedStops();
    const idx=(arr)=>arr.findIndex(s=>s.id===sid);
    card.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click",()=>{
      const arr=seq(), i=idx(arr), j=i+(+b.dataset.mv);
      if(i<0||j<0||j>=arr.length) return;
      const headArrive=arr[0].arrive;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      arr[0].arrive=headArrive; rechain(arr,1);
      mutate(); renderAll(); toast("Route reordered");
    }));
    card.querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>{
      const arr=seq(), i=idx(arr); if(i<0) return;
      const st=arr[i], n=Math.max(1,(+st.nights||0)+(+b.dataset.dn));
      if(n===st.nights) return;
      st.nights=n; rechain(arr,i+1);
      mutate(); renderAll();
    }));
    card.querySelector("[data-del]").addEventListener("click",()=>{
      const arr=seq(), i=idx(arr); if(i<0) return;
      const name=CITY_BY_ID[arr[i].cityId].n;
      const gone=S.trip.stops.find(s=>s.id===sid);
      S.trip.stops=S.trip.stops.filter(s=>s.id!==sid);
      const rest=sortedStops();
      if(i<rest.length) rechain(rest, Math.max(1,i));
      mutate(); renderAll();
      if(gone) trashPut("stop", gone, name+" stop");
    });
    card.querySelector("[data-edit]").addEventListener("click",()=>{
      const arr=seq(), i=idx(arr); if(i>=0) openStopDlg(arr[i].cityId);
    });
  });
  const sel=wrap.querySelector("#add-stop-sel");
  if(sel) sel.addEventListener("change",()=>{ if(sel.value) openStopDlg(sel.value); sel.value=""; });
}
function addStopPicker(){
  const opts=CITIES.filter(c=>!stopFor(c.id))

const PRICE=(p)=> p?`<span class="plan-price${p>1?" p"+p:""}">${"€".repeat(p)}</span>`:"";
const legMode=(s)=> /car|drive/i.test(s||"")?"car":/train/i.test(s||"")?"train":/ferry/i.test(s||"")?"ferry":"";
function planDayLabel(st){
  const d1=Math.round((pD(st.arrive)-pD(S.trip.startDate))/864e5)+1;
  const n=Math.max(1,+st.nights||1), d2=d1+n-1;
  const dw1=fmtDow(st.arrive), dw2=fmtDow(addD(st.arrive,n-1));
  return d1===d2?`Day ${d1} · ${dw1}`:`Days ${d1}–${d2} · ${dw1}–${dw2}`;

/* ---- booking pipeline: each checklist item has a status + price ----
   S.trip.checklist[id] = {st:"todo|researching|held|booked|paid", pr:number}
   (legacy snapshots stored `true` — normalized on read) */
const CHK_STATES=["todo","researching","held","booked","paid"];
const CHK_LABEL={todo:"to do",researching:"researching",held:"held",booked:"booked",paid:"paid"};
function chkMatchBooking(item){
  if(item.stay) return lodgingFor(item.stay);
  const m=item.match; if(!m) return null;
  const kw=m.kw? new RegExp(m.kw,"i") : null;
  /* a real booking carries a confirmation code — planning placeholders (the car pickup, the
     zipline day trip) must NOT tick their checklist item off before anything is actually booked */
  return S.trip.bookings.find(b=>
    b.conf &&
    (!m.type || b.type===m.type) &&
    (!m.city || b.cityId===m.city) &&
    (!kw || kw.test(b.name+" "+(b.notes||""))));
}
function chkState(item){
  const raw=S.trip.checklist[item.id];
  const o = raw===true ? {st:"booked"} : (raw && typeof raw==="object" ? raw : {});
  const bk=chkMatchBooking(item);
  let st=o.st||"todo";
  if(bk && st!=="paid") st="booked";
  return {st, pr:o.pr, bk, auto:!!bk};
}
const chkDone=(item)=>{ const s=chkState(item); return s.st==="booked"||s.st==="paid"; };
function priceNum(v){
  if(v==null||v==="") return 0;
  const m=String(v).replace(/[.,](\d{3})\b/g,"$1").match(/\d+(?:[.,]\d{1,2})?/);
  return m? parseFloat(m[0].replace(",",".")) : 0;
}
function chkPrice(s){ return (s.pr!=null && s.pr!=="") ? +s.pr : priceNum(s.bk && s.bk.price); }
function planBlocks(blocks, cityName){
  return `<div class="plan-blocks">${blocks.map(b=>`<div class="plan-block"><h4>${esc(b.h)}</h4><ul>${
    b.items.map(i=>`<li><b>${esc(i.n)}</b>${PRICE(i.p)}${cityName?
      ` <a class="poi-peek" href="${GM(i.n+", "+cityName)}" target="_blank" rel="noopener" title="Photos & reviews">📷</a>`:""} — ${esc(i.d)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}
function guideFor(cityId){
  if(GUIDE.days[cityId]) return GUIDE.days[cityId];
  /* fallback for cities without hand-written guide content: build from scouted POIs */

/* ---- live weather (Open-Meteo, keyless) — hosted site only, silent in the artifact ---- */
const WX={}, WX_TTL=30*60*1000;
const WX_ICON=(c)=> c===0?"☀️":c<=2?"🌤":c===3?"☁️":c<=48?"🌫":c<=57?"🌦":c<=67?"🌧":c<=77?"🌨":c<=82?"🌧":c<=86?"🌨":"⛈";
async function getWx(cityId){
  const c=CITY_BY_ID[cityId]; if(!c||!c.lat) return null;
  const w=WX[cityId];
  if(w!==undefined && (!w || Date.now()-w.at<WX_TTL)) return w;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`+
      `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min`+
      `&forecast_days=16&timezone=Europe%2FRome`);
    if(!r.ok) throw 0;
    const d=await r.json();
    WX[cityId]={at:Date.now(), t:Math.round(d.current.temperature_2m), code:d.current.weather_code,
      days:(d.daily.time||[]).map((t,i)=>({d:t, hi:Math.round(d.daily.temperature_2m_max[i]),
        lo:Math.round(d.daily.temperature_2m_min[i]), code:d.daily.weather_code[i]}))};

}

const fmtHM=(iso)=> new Date(iso).toLocaleTimeString("en-GB",
  {hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});   /* always Italy local time */
const RAILY=/RAIL|TRAIN|REGIONAL|INTERCITY|LONG_DISTANCE/i;
async function fetchPlan(fromLL,toLL,date){
  const t=encodeURIComponent(date+"T06:00:00+02:00");
  const url=`https://api.transitous.org/api/v1/plan?fromPlace=${fromLL[0]},${fromLL[1]}&toPlace=${toLL[0]},${toLL[1]}&time=${t}&numItineraries=7`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return ((await r.json()).itineraries||[]).filter(it=>(it.legs||[]).some(l=>l.mode && l.mode!=="WALK"));
}
/* rail schedules publish ~2–4 months out; when the trip date is dark, show the same weekday soon */
function sameWeekdaySoon(date){
  const target=pD(date), d=new Date();
  d.setDate(d.getDate()+1);
  while(d.getDay()!==target.getDay()) d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}

  }
}

/* ---- golden-hour compass: NOAA sun math, no API, times in Europe/Rome ---- */
function sunUT(dateISO, lat, lon, zenith, rising){
  const rad=Math.PI/180;
  const d=new Date(dateISO+"T12:00:00Z");
  const n=Math.floor((d-new Date(Date.UTC(d.getUTCFullYear(),0,0)))/864e5);
  const lngHour=lon/15;
  const t=n+((rising?6:18)-lngHour)/24;
  const M=(0.9856*t)-3.289;
  let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634;
  L=((L%360)+360)%360;
  let RA=Math.atan(0.91764*Math.tan(L*rad))/rad;
  RA=((RA%360)+360)%360;
  RA+=(Math.floor(L/90)*90-Math.floor(RA/90)*90); RA/=15;
  const sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(zenith*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
  if(cosH>1||cosH<-1) return null;
  let H=(rising?360-Math.acos(cosH)/rad:Math.acos(cosH)/rad)/15;
  let UT=H+RA-(0.06571*t)-6.622-lngHour;
  return ((UT%24)+24)%24;
}
function romeClock(dateISO, ut, offsetMin){
  if(ut==null) return null;
  const ms=Date.parse(dateISO+"T00:00:00Z")+ut*3600e3+(offsetMin||0)*60e3;
  return new Date(ms).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"Europe/Rome"});
}

/* ---- document wallet: tickets & confirmations in IndexedDB, offline-first ---- */
let DOCDB=null, DOCS=[];   /* DOCS = metadata cache; blobs stay in IndexedDB until viewed */
function docsInit(){
  return new Promise(res=>{
    let r;
    try{ r=indexedDB.open("pathseeker",2); }catch(e){ return res(); }
    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains("docs")) r.result.createObjectStore("docs",{keyPath:"id"});
    };
    r.onerror=()=>res();
    r.onsuccess=()=>{
      DOCDB=r.result;
      const out=[], c=DOCDB.transaction("docs").objectStore("docs").openCursor();
      c.onsuccess=()=>{ const cur=c.result;
        if(cur){ const {blob,...meta}=cur.value; out.push(meta); cur.continue(); }
        else { DOCS=out; res(); } };
      c.onerror=()=>res();
    };
  });
}
function docAdd(chk,file){
  return new Promise((res,rej)=>{
    const rec={id:uid(),chk,name:file.name,mime:file.type,size:file.size,added:Date.now(),blob:file};
    const tx=DOCDB.transaction("docs","readwrite");
    tx.objectStore("docs").put(rec);
    tx.oncomplete=()=>{ const{blob,...meta}=rec; DOCS.push(meta); res(meta); };
    tx.onerror=()=>rej(tx.error);
  });
}
function docGet(id){
  return new Promise((res,rej)=>{
    const q=DOCDB.transaction("docs").objectStore("docs").get(id);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
function docDel(id){
  return new Promise((res,rej)=>{
    const tx=DOCDB.transaction("docs","readwrite");
    tx.objectStore("docs").delete(id);
    tx.oncomplete=()=>{ DOCS=DOCS.filter(d=>d.id!==id); res(); };
    tx.onerror=()=>rej(tx.error);
  });
}

/* ---- the trip linter: an automatic problems panel over everything the app knows ---- */
function lintTrip(){
  const out=[];
  const days=tripDays(); if(!days.length) return out;
  const seq=sortedStops();
  /* nights with no city */
  const un=days.slice(0,-1).filter(d=>!stopsOn(d).length);
  if(un.length) out.push({sev:"warn", msg:`No city assigned for ${un.map(fmtShort).join(", ")} — fix in the Itinerary tab.`});
  /* stops with no lodging booked (grouped) */
  const unlodged=seq.filter(st=>!lodgingFor(st.cityId)).map(st=>CITY_BY_ID[st.cityId].short||CITY_BY_ID[st.cityId].n);
  if(unlodged.length)
    out.push({sev:unlodged.length===seq.length?"info":"warn",
      msg:`Lodging not booked yet: ${unlodged.join(", ")}.`});
  /* two timed bookings squeezed together */
  const timed=S.trip.bookings.filter(b=>b.date&&b.time);
  const mins=(t)=>{const[h,m]=t.split(":").map(Number);return h*60+(m||0);};
  for(let i=0;i<timed.length;i++)for(let j=i+1;j<timed.length;j++){
    const a=timed[i],b=timed[j];
    if(a.date===b.date && Math.abs(mins(a.time)-mins(b.time))<45)
      out.push({sev:"warn", msg:`Tight timing on ${fmtShort(a.date)}: “${esc(a.name)}” at ${a.time} and “${esc(b.name)}” at ${b.time}.`});
  }
  /* bookings in a city you won't be in that day */
  S.trip.bookings.forEach(b=>{
    if(!b.date||!b.cityId) return;
    if(!["hotel","airbnb","ticket","restaurant"].includes(b.type)) return;
    const here=stopsOn(b.date).map(s=>s.cityId);
    if(here.length && !here.includes(b.cityId))
      out.push({sev:"warn", msg:`“${esc(b.name)}” is in ${esc(CITY_BY_ID[b.cityId].n)} on ${fmtShort(b.date)} — but that day you're in ${esc(CITY_BY_ID[here[0]].n)}.`});
  });
  /* paperwork deadlines */
  const daysTo=Math.round((pD(S.trip.startDate)-pD(todayISO()))/864e5);
  if(daysTo>0){
    const idp=chkState(CHECKLIST.find(i=>i.id==="idp"));
    if(daysTo<35 && !(idp.st==="booked"||idp.st==="paid"))
      out.push({sev:daysTo<21?"warn":"info", msg:`International Driving Permits take 2+ weeks at AAA — ${daysTo} days to departure.`});
    const et=chkState(CHECKLIST.find(i=>i.id==="etias"));
    if(daysTo<30 && !(et.st==="booked"||et.st==="paid"))
      out.push({sev:"info", msg:`ETIAS isn't marked done — the application takes minutes (${daysTo} days out).`});
  }
  /* budget breach */
  const stt=tripStats(S.trip);
  if(S.trip.budget && stt.committed>S.trip.budget)
    out.push({sev:"warn", msg:`${money0(stt.committed-S.trip.budget)} over your ${money0(+S.trip.budget)} budget.`});
  /* holds & missing codes */
  const held=CHECKLIST.filter(i=>chkState(i).st==="held").length;
  if(held) out.push({sev:"info", msg:`${held} item${held>1?"s":""} held but not booked — don't let the holds lapse.`});
  const noconf=S.trip.bookings.filter(b=>["hotel","airbnb","train","ticket"].includes(b.type)&&!b.conf).length;
  if(noconf) out.push({sev:"info", msg:`${noconf} booking${noconf>1?"s":""} missing a confirmation code — paste the emails so tickets are on hand.`});
  /* stale phone reminders */
  if(S.icsCount!=null && S.trip.bookings.length>S.icsCount)
    out.push({sev:"info", msg:`${S.trip.bookings.length-S.icsCount} new booking${S.trip.bookings.length-S.icsCount>1?"s":""} since your last phone-reminder export.`});
  return out;
}
function nextBestAction(lints){
  const L=lints||lintTrip();
  const w=L.find(l=>l.sev==="warn");
  if(w) return "⚠ "+w.msg;
  const milan=CHECKLIST.find(i=>i.id==="stay-milan");
  if(milan && !chkDone(milan)) return "👉 Book the Milan hotel first — Fashion Week overlaps Sep 22 and prices climb daily.";
  const nxt=CHECKLIST.find(i=>!chkDone(i));
  if(nxt) return `👉 Next up: ${esc(nxt.label)}.`;
  if(S.dirty) return "💾 Everything's booked — save a snapshot to Drive.";
  const pkAll=[...PACK.flatMap(g=>g.items),...(S.trip.packCustom||[])];
  if(pkAll.some(i=>!S.trip.packing[i.id])) return "🎒 All booked — time to pack.";
  return "✨ All clear. Andiamo!";
}

function agentItemRow(item){

    acts=`<a class="btn btn-sm" href="${L.bcom}" target="_blank" rel="noopener">Booking ↗</a>
          <a class="btn btn-sm" href="${L.airbnb}" target="_blank" rel="noopener">Airbnb ↗</a>`;
  }
  if(item.href) acts+=`<a class="btn btn-sm" href="${item.href}" target="_blank" rel="noopener">${item.stay?"Direct":"Book"} ↗</a>`;
  const bkPrice=s.bk? priceNum(s.bk.price) : 0;
  return `<div class="agent-item${done?" done":""}">

function renderPlan(){

  fillWxSlots(wrap);
  const pr=$("#btn-print"); if(pr) pr.addEventListener("click",e=>{ e.preventDefault(); window.print(); });
  /* packing list */
  wrap.querySelectorAll("[data-pk]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.pk;
    S.trip.packing[id]=!S.trip.packing[id];

  wrap.querySelectorAll("[data-pkdel]").forEach(b=>b.addEventListener("click",()=>{

/* ================= JOURNAL ================= */
const guessCat=(label)=>{
  const l=(label||"").toLowerCase();
  if(/lunch|dinner|breakfast|pizza|pasta|gelato|coffee|caff|aperitivo|wine|bar|restaurant|trattoria|osteria|panin|food/.test(l)) return "food";
  if(/train|taxi|uber|bus|metro|ferry|vaporetto|parking|toll|fuel|gas|benzina|car/.test(l)) return "transport";
  if(/ticket|museum|duomo|tour|entry|zipline|volo|basilica|palazzo|gallery/.test(l)) return "sights";
  if(/hotel|airbnb|room|stay|apartment|b&b/.test(l)) return "lodging";
  return "other";
};
function renderJournal(){
  const wrap=$("#journal-wrap");
  const fDay=S.trip.begun? focusDayClamped() : null;
  const stamps=sortedStops().map((s,i)=>{
    const c=CITY_BY_ID[s.cityId]; if(!c) return "";
    const inked=fDay && s.arrive<=fDay;
    return `<div class="stamp${inked?" inked":""}" style="--rot:${(i%2?1:-1)*((i*37)%5+2)}deg">
      <span class="s-city">${esc((c.short||c.n).toUpperCase())}</span>
      <span class="s-date">${inked?fmtShort(s.arrive):"· · ·"}</span>
      <span class="s-ital">✦ ITALIA ✦</span>
    </div>`;
  }).join("");
  let head=`<h2 class="view-title serif">Travel journal</h2>
    <p class="view-sub">Every booking and note, kept with your route.</p>
    <div class="journal-form passport">
      <span class="label">Passport${fDay?"":" — stamps ink themselves as you travel"}</span>
      <div class="stamp-grid">${stamps}</div>
    </div>
    <div class="journal-form">
      <span class="label">New note</span>
      <div class="row">
        <input type="date" id="jn-date" value="${esc(S.trip.startDate)}" min="${esc(S.trip.startDate)}" max="${esc(S.trip.endDate)}">
        <input id="jn-text" placeholder="Best carbonara of my life at…">
        <button class="btn btn-sm" id="jn-add">Add note</button>
      </div>
      <div><button class="btn btn-quiet btn-sm" id="jn-paste">Booked something on Airbnb / VRBO / a hotel site? Paste the confirmation →</button></div>
    </div>`;
  const spent=S.trip.expenses.reduce((a,e)=>a+e.amount,0);
  /* categories, dollar equivalents, daily burn, and the couple's settle-up ledger */
  const EXCAT={food:"🍝",transport:"🚄",sights:"🎟",lodging:"🏨",other:"🧾"};
  const byCat={};
  S.trip.expenses.forEach(e=>{ const c=e.cat||"other"; byCat[c]=(byCat[c]||0)+e.amount; });
  let oweA=0, oweC=0;   /* halves owed to the payer */
  S.trip.expenses.forEach(e=>{
    if(e.payer==="C") oweA+=e.amount/2;
    else if(e.payer==="A") oweC+=e.amount/2;
  });
  const bal=oweA-oweC;
  const today=todayISO();
  const inTrip=today>=S.trip.startDate && today<=S.trip.endDate;
  const daysIn=inTrip? Math.max(1,Math.round((pD(today)-pD(S.trip.startDate))/864e5)+1) : 0;
  let exSummary="";
  if(spent){
    exSummary=`<div class="ex-summary">
      <b>${money(spent)}</b> <span class="ex-usd">≈ ${CUR==="USD"?"€"+Math.round(spent).toLocaleString("en-US")

  }

        </select>
      </div>
      ${S.trip.expenses.length?[...S.trip.expenses].sort((a,b)=>a.date<b.date?1:-1).map(e=>
        `<div class="exp-row"><span class="d">${fmtShort(e.date)}</span>

  const seq=sortedStops();

    const c=CITY_BY_ID[st.cityId];
    const bks=S.trip.bookings.filter(b=>b.cityId===st.cityId); bks.forEach(b=>usedB.add(b.id));
    const notes=S.trip.journal.filter(j=>{

  wrap.querySelectorAll("[data-exdel]").forEach(b=>b.addEventListener("click",()=>{
    const gone=S.trip.expenses.find(x=>x.id===b.dataset.exdel);

    const gone=S.trip.journal.find(j=>j.id===b.dataset.jdel);
    S.trip.journal=S.trip.journal.filter(j=>j.id!==b.dataset.jdel);
    mutate(); renderJournal();
    if(gone) trashPut("note", gone, (gone.text||"note").slice(0,40));
  }));
}

const MCP_FIX = {
  needs_reauth: "Google Drive needs to be reconnected — claude.ai Settings → Connectors.",
  server_not_connected: "Add the Google Drive connector in claude.ai Settings → Connectors, then reload.",
  selection_required: "Choose which Google Drive to use when claude.ai asks, then try again.",

};
const errCopy=(e)=> (e && MCP_FIX[e.code]) || (e && e.code==="tool_error" ? ("Drive reported a problem: "+(e.message||"unknown error"))
  : "Couldn't reach Google Drive just now — your trip is still safe on this device.");
async function mcpInit(){
  if(!window.claude || window.claude.mcp===undefined){ UI.mcpReady=false; updateSyncUI(); return; }
  try{
    const r=await window.claude.mcp.listTools();
    const srv=(r.servers||[]).find(s=>s.tools && s.tools.some(t=>/search_files|create_file/.test(t.name))) || (r.servers||[])[0];
    if(srv){ UI.mcpServer=srv.server; UI.mcpReady=true; }
  }catch(e){ UI.mcpReady=false; }
  updateSyncUI();
  if(UI.mcpReady) checkDriveNewer();

const drivePayload=()=> JSON.stringify({app:"pathseeker", version:1, savedAt:new Date().toISOString(), trip:S.trip});
async function driveSearchNewest(){
  const r=await window.claude.mcp.callTool(UI.mcpServer,"search_files",
    {query:"title contains 'pathseeker.json'", pageSize:10, excludeContentSnippets:true},{cache:false});
  const files=(r.payload && r.payload.files)||[];
  files.sort((a,b)=> (a.modifiedTime<b.modifiedTime?1:-1));
  return files[0]||null;
}
async function driveDownload(fileId){
  const r=await window.claude.mcp.callTool(UI.mcpServer,"download_file_content",{fileId},{cache:false});
  const b64=r.payload && r.payload.content;
  if(!b64) throw {code:"tool_error", message:"empty file"};
  const txt=new TextDecoder().decode(Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)));
  return JSON.parse(txt);
}
function adoptTrip(data, sourceLabel){
  if(!data || data.app!=="pathseeker" || !data.trip){ throw new Error("not a Pathseeker file"); }
  S.trip=Object.assign(DEFAULT_TRIP(), data.trip);
  S.dirty=false; S.driveSavedAt=data.savedAt||null;
  persist(); renderAll(); renderHome(); updateSyncUI();
  toast("Trip loaded"+(sourceLabel?` from ${sourceLabel}`:""));
}
async function driveSave(){
  const btn=$("#btn-drive-save"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const payload=drivePayload();
    await window.claude.mcp.callTool(UI.mcpServer,"create_file",
      {title:DRIVE_FILE, textContent:payload, contentMimeType:"text/plain", disableConversionToGoogleType:true});
    S.dirty=false; S.driveSavedAt=JSON.parse(payload).savedAt; persist(); updateSyncUI();
    syncMsg("Saved to Google Drive. Open Pathseeker on your other device and hit Load.","ok");
  }catch(e){ syncMsg(errCopy(e),"err"); }
  btn.disabled=false; btn.textContent="Save";
}
async function driveLoad(){
  const btn=$("#btn-drive-load"); btn.disabled=true; btn.textContent="Loading…";
  try{
    const f=await driveSearchNewest();
    if(!f){ syncMsg("No Pathseeker save found in this Google Drive yet.","err"); }
    else{
      const data=await driveDownload(f.id);
      adoptTrip(data,"Drive");
      syncMsg(`Loaded snapshot from ${new Date(f.modifiedTime).toLocaleString()}.`,"ok");
    }
  }catch(e){ syncMsg(e && e.code? errCopy(e) : "That file couldn't be read as a Pathseeker trip.","err"); }
  btn.disabled=false; btn.textContent="Load";
}
async function checkDriveNewer(){
  try{
    const f=await driveSearchNewest();
    if(!f) return;
    const local=S.savedAt||"1970";
    if(f.modifiedTime > local && (S.trip.stops.length||S.trip.bookings.length||true)){
      const bn=document.createElement("div");
      bn.className="drive-banner";
      bn.innerHTML=`<span style="flex:1">A newer Pathseeker save exists on Drive (${new Date(f.modifiedTime).toLocaleString()}). Load it here?</span>
        <button class="btn" id="bn-load">Load</button><button class="btn btn-quiet" id="bn-x">Not now</button>`;
      document.body.appendChild(bn);
      bn.querySelector("#bn-x").addEventListener("click",()=>bn.remove());
      bn.querySelector("#bn-load").addEventListener("click",async()=>{
        try{ adoptTrip(await driveDownload(f.id),"Drive"); }catch(e){ toast("Couldn't load that snapshot"); }
        bn.remove();
      });
    }
  }catch(e){ /* quiet — banner is best-effort */ }
}
async function exportFile(){
  const data=drivePayload();
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:"pathseeker-italy.json", data}); syncMsg("Backup exported.","ok"); return; }
    catch(e){
      if(e && e.code==="declined") return;
      if(e && e.code==="rate_limited"){ syncMsg("A download prompt is already open — try again in a moment.","err"); return; }
    }
  }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download="pathseeker-italy.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ syncMsg("Export isn't available here — use Save to Drive instead.","err"); }
}
/* ================= LIVE SYNC — one trip, every device =================
   A Firebase Realtime Database holds the trip; each device streams changes over
   EventSource and pushes its own edits back. Documents (passports, tickets) never
   leave the device they were added on. Pages only — the artifact's CSP blocks it. */
let CLOUD=null, cloudES=null, cloudPushT=null, cloudApplying=false, cloudState="off";
let cloudRetryT=null, cloudTries=0, cloudPending=false;
/* per-tab, not per-device: two tabs open on the same computer should still see
   each other's edits, while a tab never re-adopts the write it just made. */
const DEVICE_ID = uid()+uid();
function cloudLoad(){ try{ CLOUD=JSON.parse(localStorage.getItem("ps.cloud")||"null"); }catch(e){ CLOUD=null; } return CLOUD; }
function cloudSet(c){ CLOUD=c; if(c) localStorage.setItem("ps.cloud",JSON.stringify(c)); else localStorage.removeItem("ps.cloud"); }
const cloudUrl=()=> CLOUD? `${CLOUD.url.replace(/\/+$/,"")}/trips/${CLOUD.key}.json` : null;
const newTripKey=()=>{ const a=new Uint8Array(24); (crypto||{}).getRandomValues?.(a);
  return [...a].map(b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join(""); };
function cloudStatus(t){
  cloudState=t;
  const el=$("#cloud-status");
  if(el) el.textContent = CLOUD? `${t} · this device is linked` :
    "Off — set it up once and every phone, tablet and laptop follows along automatically.";
  const b=$("#btn-cloud"); if(b) b.textContent = CLOUD? "Manage" : "Set up";
  updateSyncUI();
}
async function cloudPush(){
  if(!CLOUD || cloudApplying) return;
  try{
    const r=await fetch(cloudUrl(),{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({app:"pathseeker",version:1,savedAt:new Date().toISOString(),device:DEVICE_ID,trip:S.trip})});
    cloudPending = !r.ok;
    cloudStatus(r.ok? "Live" : "Sync error");
  }catch(e){ cloudPending=true; cloudStatus("Offline — will retry"); }
}
function cloudPushSoon(){ if(!CLOUD||cloudApplying) return; clearTimeout(cloudPushT); cloudPushT=setTimeout(cloudPush,1200); }
function cloudAdopt(payload){
  if(!payload || !payload.trip || payload.device===DEVICE_ID) return;
  cloudApplying=true;
  S.trip=Object.assign(DEFAULT_TRIP(), payload.trip);
  S.dirty=false; persist();
  try{ renderAll(); renderHome(); }catch(e){}
  cloudApplying=false;
  cloudStatus("Live");
}
async function cloudPull(){ try{ const r=await fetch(cloudUrl()); cloudAdopt(await r.json()); }catch(e){} }
function cloudConnect(){
  if(!CLOUD || typeof EventSource==="undefined") return;
  try{ cloudES && cloudES.close(); }catch(e){}
  cloudStatus("Connecting…");
  cloudES=new EventSource(cloudUrl());
  cloudES.addEventListener("put",e=>{
    try{ const d=JSON.parse(e.data); if(d.path==="/") cloudAdopt(d.data); else cloudPull(); }catch(err){}
  });
  cloudES.addEventListener("patch",()=>cloudPull());
  cloudES.onopen=()=>{ cloudTries=0; cloudStatus("Live"); };
  /* A closed EventSource never retries on its own, and Firebase drops long-lived
     streams (and phones kill them whenever the tab is backgrounded). Without this
     the app sits on "Reconnecting…" forever and silently stops syncing. */
  cloudES.onerror=()=>{
    cloudStatus("Reconnecting…");
    if(!cloudES || cloudES.readyState===2) cloudRetry();
  };
}
/* If our own last push failed, our edits are the newer ones — send them rather
   than pulling the server copy over the top of them. */
function cloudResync(){
  if(!CLOUD) return;
  if(cloudPending) cloudPush(); else cloudPull();
  if(!cloudES || cloudES.readyState===2) cloudConnect();
}
function cloudRetry(){
  clearTimeout(cloudRetryT);
  const wait=Math.min(30000, 1000*Math.pow(2,cloudTries++));
  cloudRetryT=setTimeout(cloudResync, wait);
}
function cloudWatchdog(){
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) cloudResync(); });
  window.addEventListener("online", cloudResync);
  window.addEventListener("focus", ()=>{ if(CLOUD && cloudES && cloudES.readyState===2) cloudResync(); });
  setInterval(()=>{ if(CLOUD && (!cloudES || cloudES.readyState===2)) cloudResync(); }, 60000);
}
const joinLink=()=> CLOUD? `${location.origin}${location.pathname}#join=${btoa(JSON.stringify({u:CLOUD.url,k:CLOUD.key}))}` : "";
function renderCloudDlg(){
  const b=$("#cloud-body");
  if(!CLOUD){
    b.innerHTML=`<p style="font-size:13.5px;margin:0 0 12px">Paste the <b>Realtime Database URL</b> from your Firebase
      project — it looks like <code>https://pathseeker-1234-default-rtdb.firebaseio.com</code>.</p>
      <input id="cloud-url" placeholder="https://…firebaseio.com" style="width:100%">
      <div class="quick-row" style="margin-top:12px">
        <button type="button" class="btn btn-sm btn-primary" id="cloud-go">Start syncing</button>
      </div>

    $("#cloud-go").addEventListener("click",async()=>{

    });
  }else{
    b.innerHTML=`<p style="font-size:13.5px;margin:0 0 10px"><b>${esc(cloudState)}</b> — edits here reach every linked device in about a second.</p>
      <span class="label" style="display:block;margin-bottom:6px">Open this link on your other devices</span>
      <input id="cloud-link" readonly value="${esc(joinLink())}" style="width:100%;font-size:11.5px">
      <div class="quick-row" style="margin-top:10px">
        <button type="button" class="btn btn-sm btn-primary" id="cloud-copy">Copy link</button>
        <button type="button" class="btn btn-sm" id="cloud-pull">Pull now</button>
        <button type="button" class="btn btn-sm" id="cloud-off">Unlink this device</button>
      </div>
      <p class="times-note">Treat the link like a key: anyone who has it can see and edit the trip.
        Passport scans and tickets stay on the device that added them.</p>`;
    $("#cloud-copy").addEventListener("click",()=>{
      const t=joinLink();
      navigator.clipboard?.writeText(t).then(()=>toast("Link copied — send it to your phone"),
        ()=>{ $("#cloud-link").select(); });
    });
    $("#cloud-pull").addEventListener("click",cloudPull);
    $("#cloud-off").addEventListener("click",()=>{
      try{ cloudES && cloudES.close(); }catch(e){}
      cloudSet(null); cloudStatus("off"); renderCloudDlg(); toast("This device is no longer syncing");
    });
  }
}
function openCloudDlg(){ renderCloudDlg(); const d=$("#dlg-cloud"); d.returnValue=""; if(!d.open) d.showModal(); }
function cloudInit(){
  const m=/#join=([^&]+)/.exec(location.hash||"");
  if(m){
    try{ const j=JSON.parse(atob(decodeURIComponent(m[1])));
      if(j.u&&j.k){ cloudSet({url:j.u,key:j.k}); history.replaceState(null,"",location.pathname); } }catch(e){}
  }
  cloudLoad();
  if(CLOUD){ cloudConnect(); cloudPull(); }
  cloudStatus(CLOUD? "Connecting…" : "off");
  cloudWatchdog();
}

/* ================= PHOTOS (device-local, IndexedDB) ================= */
let PHOTOS=[], PHOTO_OK=true, photoCtx=null, phOpen=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("pathseeker",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("photos",{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function photoLoadAll(){
  try{
    const db=await idbOpen();
    PHOTOS=await new Promise((res,rej)=>{
      const q=db.transaction("photos").objectStore("photos").getAll();
      q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
    });
    PHOTOS.sort((a,b)=> a.date<b.date?-1:1);
  }catch(e){ PHOTO_OK=false; }
}
async function photoPut(p){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction("photos","readwrite").objectStore("photos").put(p);
    q.onsuccess=res; q.onerror=()=>rej(q.error);
  });
}
async function photoRemove(id){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction("photos","readwrite").objectStore("photos").delete(id);
    q.onsuccess=res; q.onerror=()=>rej(q.error);
  });
}
function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600, r=Math.min(1, max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*r)); cv.height=Math.max(1,Math.round(img.height*r));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL("image/jpeg",0.8));
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); rej(new Error("unreadable image")); };
    img.src=URL.createObjectURL(file);
  });
}
async function addPhotos(files, ctx){
  if(!PHOTO_OK){ toast("Photos aren't available in this browser view"); return; }
  let n=0;
  for(const f of files){
    try{
      const src=await compressImage(f);
      const p={id:uid(), cityId:ctx.cityId||UI.selected||S.trip.arrivalCity,
        date:ctx.date||clampDay(todayISO()), caption:"", src};
      await photoPut(p); PHOTOS.push(p); n++;
    }catch(e){}
  }
  if(n) toast(`${n} photo${n===1?"":"s"} pinned to ${CITY_BY_ID[ctx.cityId]?.n||"your trip"}`);
  else toast("Couldn't read that image");
  renderAll();
}
const photosFor=(cityId)=> PHOTOS.filter(p=>p.cityId===cityId);
const photoGrid=(list)=> list.length?
  `<div class="photo-grid">${list.map(p=>
    `<img class="photo-thumb" data-photo="${p.id}" src="${p.src}" alt="${esc(p.caption||"trip photo")}" loading="lazy">`).join("")}</div>` : "";
function wirePhotos(root){
  root.querySelectorAll("[data-photo]").forEach(im=>
    im.addEventListener("click",()=>openPhoto(im.dataset.photo)));
}
function openPhoto(id){
  const p=PHOTOS.find(x=>x.id===id); if(!p) return;
  phOpen=p;
  $("#ph-img").src=p.src;
  $("#ph-meta").textContent=`${CITY_BY_ID[p.cityId]?.n||"Somewhere"} · ${fmtShort(p.date)}`;
  $("#ph-cap").value=p.caption||"";
  $("#dlg-photo").returnValue="";
  $("#dlg-photo").showModal();
}
function promptPhoto(ctx, camera){
  photoCtx=ctx;
  $(camera? "#photo-take" : "#photo-import").click();
}
function initPhotos(){
  $("#dlg-photo").addEventListener("close", async ()=>{
    if(!phOpen) return;
    if($("#dlg-photo").returnValue==="remove"){
      try{ await photoRemove(phOpen.id); }catch(e){}
      PHOTOS=PHOTOS.filter(x=>x.id!==phOpen.id);
      toast("Photo deleted"); renderAll();
    }else{
      const cap=$("#ph-cap").value.trim();
      if(cap!==(phOpen.caption||"")){ phOpen.caption=cap; try{ await photoPut(phOpen); }catch(e){} }
    }
    phOpen=null;
  });
  const onPick=(e)=>{
    if(e.target.files.length && photoCtx) addPhotos([...e.target.files], photoCtx);
    e.target.value="";
  };
  $("#photo-take").addEventListener("change",onPick);
  $("#photo-import").addEventListener("change",onPick);
}

/* ================= TRIP SHEET ================= */
function buildTripSheet(){
  const L=[];
  L.push("PATHSEEKER — ITALY TRIP SHEET");
  L.push(`${fmtShort(S.trip.startDate)} – ${fmtShort(S.trip.endDate)}, ${S.trip.startDate.slice(0,4)}`);
  L.push(`Fly into ${CITY_BY_ID[S.trip.arrivalCity]?.n||"—"} · out of ${CITY_BY_ID[S.trip.departureCity]?.n||"—"}`);
  L.push("Emergency 112 (EU-wide) · Validate regional train tickets before boarding");
  L.push("=".repeat(46));
  const route=sortedStops().map(s=>`${CITY_BY_ID[s.cityId].n} (${fmtShort(s.arrive)}, ${s.nights}n)`).join(" → ");
  if(route){ L.push("ROUTE: "+route); L.push("=".repeat(46)); }
  for(const d of tripDays()){
    const here=stopsOn(d);
    const cityNames=here.map(s=>CITY_BY_ID[s.cityId].n).join(" / ")||"(unassigned)";
    L.push("");
    L.push(`${fmtDow(d).toUpperCase()} ${fmtShort(d).toUpperCase()} — ${cityNames.toUpperCase()}${d===S.trip.startDate?" (ARRIVE)":""}${d===S.trip.endDate?" (FLY HOME)":""}`);
    for(const s of here.filter(s=>s.arrive===d)){
      const prev=(stopsOn(addD(d,-1))[0]||{}).cityId;
      if(prev && prev!==s.cityId){
        const tt=travelInfo(prev,s.cityId);
        L.push(`  TRAVEL: ${CITY_BY_ID[prev].n} -> ${CITY_BY_ID[s.cityId].n}${tt?` (~${tt})`:""}`);
      }
      const lg=lodgingFor(s.cityId);
      if(lg) L.push(`  CHECK-IN: ${lg.name}${lg.conf?` · conf #${lg.conf}`:""}${lg.price?` · ${lg.price}`:""}${lg.notes?` · ${lg.notes}`:""}`);
      const cn=stripTags(CITY_BY_ID[s.cityId].note).replace(/\s+/g," ").trim();
      if(cn) L.push(`  NOTE: ${cn}`);
    }
    for(const b of S.trip.bookings.filter(b=>b.date===d).sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1)){
      L.push(`  ${b.time||"--:--"} ${b.name} [${typeMeta(b.type).n}]${b.conf?` · conf #${b.conf}`:""}${b.price?` · ${b.price}`:""}${b.notes?` · ${b.notes}`:""}`);
    }
    for(const j of S.trip.journal.filter(j=>j.date===d)) L.push(`  ✎ ${j.text}`);
  }
  const spent=S.trip.expenses.reduce((a,e)=>a+e.amount,0);
  if(spent){ L.push(""); L.push(`SPENDING LOGGED: ${money(spent)}`); }
  L.push(""); L.push(`Generated ${new Date().toLocaleString()} · Pathseeker`);
  return L.join("\n");
}

/* ---- compass mode: an ornate needle pointing at tonight's town ---- */
const CMP={watch:null, heading:null, pos:null, target:null};
const toRad=(d)=>d*Math.PI/180;
function bearingTo(la1,lo1,la2,lo2){
  const y=Math.sin(toRad(lo2-lo1))*Math.cos(toRad(la2));
  const x=Math.cos(toRad(la1))*Math.sin(toRad(la2))-Math.sin(toRad(la1))*Math.cos(toRad(la2))*Math.cos(toRad(lo2-lo1));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function distKm(la1,lo1,la2,lo2){
  const R=6371, dLa=toRad(la2-la1), dLo=toRad(lo2-lo1);
  const a=Math.sin(dLa/2)**2+Math.cos(toRad(la1))*Math.cos(toRad(la2))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function cmpUpdate(){
  const c=CITY_BY_ID[CMP.target];
  if(!CMP.pos||!c) return;
  const br=bearingTo(CMP.pos.lat,CMP.pos.lon,c.lat,c.lon);
  const d=distKm(CMP.pos.lat,CMP.pos.lon,c.lat,c.lon);
  const rot=CMP.heading==null? br : br-CMP.heading;
  $("#cmp-needle").style.transform=`translate(-50%,-100%) rotate(${rot}deg)`;
  $("#cmp-info").innerHTML=`<b>${esc(c.n)}</b> · ${d<1?Math.round(d*1000)+" m":(d<10?d.toFixed(1):Math.round(d))+" km"} away`+
    (CMP.heading==null?`<br><span class="times-note">no compass sensor here — needle shows bearing from north</span>`:"");
}
function cmpOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
  else if(typeof e.alpha==="number" && (e.absolute||e.type==="deviceorientationabsolute")) h=360-e.alpha;
  if(h!=null){ CMP.heading=h; cmpUpdate(); }
}
function cmpStop(){
  if(CMP.watch!=null && navigator.geolocation){ navigator.geolocation.clearWatch(CMP.watch); CMP.watch=null; }
  window.removeEventListener("deviceorientation",cmpOri);
  window.removeEventListener("deviceorientationabsolute",cmpOri);
  CMP.heading=null;
}
async function cmpStart(){
  $("#cmp-info").textContent="Locating…";
  if(navigator.geolocation && CMP.watch==null){
    CMP.watch=navigator.geolocation.watchPosition(p=>{
      CMP.pos={lat:p.coords.latitude,lon:p.coords.longitude}; cmpUpdate();
    },()=>{ $("#cmp-info").textContent="Location unavailable — allow location access and try again."; },
    {enableHighAccuracy:true,maximumAge:5000});
  }
  try{
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==="function"){
      const st=await DeviceOrientationEvent.requestPermission();   /* iOS gesture-gated */
      if(st==="granted") window.addEventListener("deviceorientation",cmpOri);
    }else{
      window.addEventListener("deviceorientationabsolute",cmpOri);
      window.addEventListener("deviceorientation",cmpOri);
    }
  }catch(e){}
}
function openCompass(defaultCity){
  const dlg=$("#dlg-compassnav"), sel=$("#cmp-target");
  const ids=[...new Set([S.trip.arrivalCity,...sortedStops().map(s=>s.cityId),S.trip.departureCity])].filter(id=>CITY_BY_ID[id]);
  sel.innerHTML=ids.map(id=>`<option value="${id}">${esc(CITY_BY_ID[id].n)}</option>`).join("");
  CMP.target=(defaultCity&&ids.includes(defaultCity))?defaultCity:ids[0];
  sel.value=CMP.target;
  sel.onchange=()=>{ CMP.target=sel.value; cmpUpdate(); };
  $("#cmp-info").textContent="Tap Start to aim the needle.";
  dlg.returnValue=""; if(!dlg.open) dlg.showModal();
  dlg.addEventListener("close",cmpStop,{once:true});
}

/* ---- phone reminders: .ics calendar with alarms for every dated booking ----
   No push server here by design — the phone's own calendar is the most reliable
   alarm delivery there is (works offline, locked, and for anyone who imports it). */
const icsEsc=(s)=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsDT(date,time){ return date.replace(/-/g,"")+"T"+(time||"09:00").replace(":","")+"00"; }
function buildICS(){
  const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const V=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pathseeker//Italy//EN",
    "CALSCALE:GREGORIAN","X-WR-CALNAME:Pathseeker · Italia","X-WR-TIMEZONE:Europe/Rome"];
  let n=0;
  [...S.trip.bookings].sort((a,b)=>a.date<b.date?-1:1).forEach(b=>{
    if(!b.date) return;
    const c=CITY_BY_ID[b.cityId];
    const isFlight=/✈/.test(b.name)||/flight/i.test(b.name);
    let time=b.time, alarms, icon;
    if(isFlight){ alarms=["-P1D","-PT3H"]; time=time||"09:00"; icon="✈"; }
    else if(b.type==="train"){ alarms=["-PT2H","-PT45M"]; time=time||"09:00"; icon="🚄"; }
    else if(b.type==="hotel"||b.type==="airbnb"){ alarms=["-PT2H"]; time=time||"15:00"; icon="🏨"; }
    else if(b.type==="restaurant"){ alarms=["-PT2H"]; time=time||"19:30"; icon="🍝"; }
    else { alarms=["-PT2H"]; time=time||"10:00"; icon="🎟"; }
    const desc=[(b.from||b.to)?`${b.from||"?"} → ${b.to||"?"}`:"",
      b.conf?`Confirmation: ${b.conf}`:"", b.loyalty?`Loyalty: ${b.loyalty}`:"", b.price?`Price: ${b.price}`:"",
      b.link||"", (b.notes||"").slice(0,400)].filter(Boolean).join("\n");
    V.push("BEGIN:VEVENT",
      `UID:${b.id}@pathseeker`,
      `DTSTAMP:${now}`,
      `DTSTART;TZID=Europe/Rome:${icsDT(b.date,time)}`,
      b.arrTime? `DTEND;TZID=Europe/Rome:${icsDT(b.arrDate || (b.arrTime<time? addD(b.date,1) : b.date), b.arrTime)}`
               : "DURATION:PT1H30M",
      `SUMMARY:${icsEsc(icon+" "+b.name)}`,
      c?`LOCATION:${icsEsc(c.n+", Italy")}`:"",
      desc?`DESCRIPTION:${icsEsc(desc)}`:"");
    alarms.forEach(a=>V.push("BEGIN:VALARM","ACTION:DISPLAY",
      `TRIGGER:${a}`,`DESCRIPTION:${icsEsc(b.name)}`,"END:VALARM"));
    V.push("END:VEVENT"); n++;
  });
  /* morning briefings: one all-day event per trip day, the whole plan in the description,
     8 AM alarm — the phone's calendar becomes the concierge */
  tripDays().forEach((d,i)=>{
    const here=stopsOn(d).map(s=>CITY_BY_ID[s.cityId].n).join(" & ");
    const bks=[...S.trip.bookings.filter(b=>b.date===d)].sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1);
    const cityId=(stopsOn(d)[0]||{}).cityId;
    const lines=[
      here?`In ${here}.`:"Unassigned day.",
      ...bks.map(b=>`• ${b.time?b.time+" — ":""}${b.name}${b.conf?` (code ${b.conf})`:""}`),
      cityId?stripTags(goldenLine(cityId,d)):"",
    ].filter(Boolean);
    V.push("BEGIN:VEVENT",
      `UID:brief-${d}@pathseeker`,
      `DTSTAMP:${now}`,
      `DTSTART;VALUE=DATE:${d.replace(/-/g,"")}`,
      `SUMMARY:${icsEsc(`🧭 Day ${i+1} — ${here||"Italy"}`)}`,
      `DESCRIPTION:${icsEsc(lines.join("\n"))}`,
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER;RELATED=START:PT8H",
      `DESCRIPTION:${icsEsc("Day "+(i+1)+" briefing")}`,"END:VALARM",
      "END:VEVENT");
    n++;
  });
  V.push("END:VCALENDAR");
  return {ics:V.filter(Boolean).join("\r\n"), count:n};
}
async function exportICS(){
  const {ics,count}=buildICS();
  if(!count){ toast("No dated bookings yet — log some first"); return; }
  S.icsCount=S.trip.bookings.length; persist();
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:"pathseeker-italy.ics", data:ics});
      toast(`${count} reminders exported — open the file to add them to your calendar`); return; }
    catch(e){
      if(e && e.code==="declined") return;
      if(e && e.code==="rate_limited"){ toast("A download prompt is already open — try again shortly"); return; }
    }
  }
  try{
    const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
    const a=document.createElement("a"); a.href=url; a.download="pathseeker-italy.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(`${count} reminders exported — open the file to add them to your calendar`);
  }catch(e){ toast("Couldn't export here"); }
}

let FX_RATE=1.15, FX_LIVE=false;   /* EUR→USD; fallback ≈ Aug 2026 */
async function fxFetch(){
  if(FX_LIVE) return;
  try{
    const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD");
    if(!r.ok) throw 0;
    const d=await r.json();
    if(d.rates && d.rates.USD){ FX_RATE=d.rates.USD; FX_LIVE=true;
      const n=$("#fx-note"); if(n) n.textContent=`€1 = $${FX_RATE.toFixed(4)} · European Central Bank rate, ${d.date}`;
      fxQuick(); }
  }catch(e){
    const n=$("#fx-note"); if(n) n.textContent=`€1 ≈ $${FX_RATE.toFixed(2)} — approximate rate (live rate needs the web version)`;
  }
}
function fxQuick(){
  const q=$("#fx-quick"); if(!q) return;
  q.innerHTML=[10,20,50,100,200].map(e=>`<span class="fx-chip">€${e} ≈ $${Math.round(e*FX_RATE)}</span>`).join("");

function wireFx(){
  const eur=$("#fx-eur"), usd=$("#fx-usd");
  const num=(v)=>{ const m=String(v).replace(",",".").match(/\d+(\.\d+)?/); return m? parseFloat(m[0]) : null; };
  eur.addEventListener("input",()=>{ const v=num(eur.value); usd.value = v==null? "" : (v*FX_RATE).toFixed(2); });
  usd.addEventListener("input",()=>{ const v=num(usd.value); eur.value = v==null? "" : (v/FX_RATE).toFixed(2); });
  fxQuick(); fxFetch();
}

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function extractDates(txt){
  const yr=+(S.trip.startDate||"2026-01-01").slice(0,4);
  const found=[]; const push=(y,m,d)=>{
    if(m>=1&&m<=12&&d>=1&&d<=31) found.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  };
  const seen=new Set(); const scan=(re,fn)=>{ for(const m of txt.matchAll(re)){ if(!seen.has(m.index)){ seen.add(m.index); fn(m); } } };
  scan(/\b(20\d{2})-(\d{2})-(\d{2})\b/g, m=>push(+m[1],+m[2],+m[3]));
  scan(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d{2}))?/gi,
    m=>push(m[3]?+m[3]:yr, MONTHS[m[1].slice(0,3).toLowerCase()], +m[2]));
  scan(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(20\d{2}))?/gi,
    m=>push(m[3]?+m[3]:yr, MONTHS[m[2].slice(0,3).toLowerCase()], +m[1]));
  scan(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/g, m=>push(+m[3],+m[1],+m[2]));
  return [...new Set(found)].sort();
}
function parseConfirmation(txt){
  const lower=txt.toLowerCase();
  let type="hotel";
  if(/\b(flight|airline|boarding pass|united|delta|american airlines|lufthansa|british airways|ita airways)\b/.test(lower)
     || /\b[A-Z]{2}\s?\d{1,4}\b/.test(txt)) type="flight";
  else if(lower.includes("airbnb")) type="airbnb";
  else if(lower.includes("vrbo")||lower.includes("booking.com")||lower.includes("hotel")||lower.includes("check-in")) type="hotel";
  else if(lower.includes("trenitalia")||lower.includes("italo")||lower.includes("train")) type="train";
  else if(lower.includes("museum")||lower.includes("tour")||lower.includes("ticket")||lower.includes("entry")) type="ticket";
  else if(lower.includes("restaurant")||lower.includes("table")||lower.includes("dinner")) type="restaurant";
  const CITY_ALIASES={milan:["milano"],venice:["venezia"],rome:["roma"],naples:["napoli"],
    florence:["firenze"],turin:["torino"],amalfi:["positano","ravello"],
    cinqueterre:["vernazza","monterosso","riomaggiore","manarola"],como:["varenna","bellagio"]};
  /* collect every mentioned city with its position; trains file under the destination (last mention) */
  const found=[];
  for(const c of CITIES){
    const names=[c.n.toLowerCase(), ...(CITY_ALIASES[c.id]||[])];
    for(const nm of names){
      let idx=lower.lastIndexOf(nm);
      if(idx>=0){ found.push({id:c.id, idx}); break; }
    }
  }
  found.sort((a,b)=>a.idx-b.idx);
  let cityId = found.length ? (type==="train" ? found[found.length-1].id : found[0].id) : null;
  let conf="";
  let m=txt.match(/(?:confirmation|reservation|booking|itinerary|PNR)[^\S\n]*(?:code|number|reference|#|no\.?|:)?[^\S\n]*[:#]?[^\S\n]*([A-Z0-9][A-Z0-9-]{4,13})(?![a-z])/i);
  if(m) conf=m[1]; else { m=txt.match(/\bHM[A-Z0-9]{6,10}\b/); if(m) conf=m[0]; }
  let price="";
  m=txt.match(/total[^\n]{0,40}?((?:€|EUR\s?|\$|USD\s?|£)\s?\d[\d.,]*)/i);
  if(m) price=m[1].trim();
  else { m=txt.match(/(?:€|\$|£)\s?\d[\d.,]*/); if(m) price=m[0]; }
  let time="";
  m=txt.match(/\b(?:departs?|departure|check.?in(?:\s+from)?|pick.?up|at)\D{0,12}([01]?\d|2[0-3]):([0-5]\d)\s?(am|pm)?\b/i)
    || txt.match(/\b([01]?\d|2[0-3]):([0-5]\d)\s?(am|pm)?\b/i);
  if(m){
    let hh=+m[1]; const ap=(m[3]||"").toLowerCase();
    if(ap==="pm"&&hh<12) hh+=12; if(ap==="am"&&hh===12) hh=0;
    time=String(hh).padStart(2,"0")+":"+m[2];
  }
  let name="";
  for(const line of txt.split(/\n/)){
    const t=line.trim();
    if(t.length>3 && t.length<80 && /[a-zA-Z]{3}/.test(t) &&
       !/confirm|reservation|receipt|thank|dear|hello|hi |total|http|@|check.?in|check.?out/i.test(t)){ name=t; break; }
  }
  const dates=extractDates(txt);
  const out={type, name, conf, price};
  if(time) out.time=time;
  if(cityId) out.cityId=cityId;
  if(dates.length) out.date=dates[0];
  if(dates.length>1) out.notes=`Check-out ${fmtShort(dates[dates.length-1])} (imported from confirmation)`;
  return out;
}

}

function pcStep(d){ if(PC.city) showPostcard(PC.city,PC.idx+d); }
function wirePostcards(){
  $("#pc-prev").addEventListener("click",()=>pcStep(-1));
  $("#pc-next").addEventListener("click",()=>pcStep(1));
  $("#pc-img").addEventListener("click",e=>{
    const r=e.currentTarget.getBoundingClientRect();
    pcStep((e.clientX-r.left) < r.width/2 ? -1 : 1);
  });
  const dlg=$("#dlg-postcard");
  dlg.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){ e.preventDefault(); pcStep(-1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); pcStep(1); }
  });
  let tx=null,ty=null;
  dlg.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
  dlg.addEventListener("touchend",e=>{
    if(tx===null) return;
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
    if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.5) pcStep(dx<0?1:-1);
  },{passive:true});
}
