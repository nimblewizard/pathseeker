    `-webkit-mask:url(${BG_HDLOGO}) center/100% 100% no-repeat;`+
    `mask:url(${BG_HDLOGO}) center/100% 100% no-repeat}`+
    `@media (prefers-reduced-motion:no-preference){.appbar::after{animation:psheen 26s ease-in-out infinite}}`+
    `@keyframes psheen{0%,62%{background-position:-160% 0}96%,100%{background-position:260% 0}}`+
    `#view-map{background-image:url(${BG_MAPDESK});background-size:cover;background-position:center}`+
    `.home-card{background-image:url(${BG_SCROLL});background-size:100% 100%;background-repeat:no-repeat}`+
    `.plan-hero{background-image:url(${BG_PLANHERO})}`+
    `.plan-day-head{background-image:linear-gradient(rgba(35,18,8,.30),rgba(35,18,8,.42)),url(${BG_DAYHEAD});`+
    `background-size:cover;background-position:center 30%}`+
    `.panel,dialog,.stop-card,.journal-form,.j-note,.t-card,.ess,.book-block,`+
    `.travel-note,.plan-route,.plan-day,.plan-panel,.plan-fact,.plan-gem,.bk,.day-scrub`+
    `{background-image:url(${BG_CARD});background-size:cover;background-position:center}`+
    /* the map sidebar is a lamplit Venetian panel, not parchment */
    /* the banner hangs over the map's edge — stretched to the panel, cut free of its black */
    `.side-art{background-image:url(${BG_SIDE})}`+
    `.btn-ribbon{background-image:url(${BG_RIBBON})}`+
    /* candlelight: same parchment, dimmed to lamplight */
    `:root[data-theme="dark"] :is(.panel,dialog,.stop-card,.journal-form,.j-note,.t-card,.ess,.book-block,`+
    `.travel-note,.plan-route,.plan-day,.plan-panel,.plan-fact,.plan-gem,.bk,.day-scrub)`+
    `{background-image:linear-gradient(rgba(23,15,7,.87),rgba(23,15,7,.87)),url(${BG_CARD})}`+
    `@media (max-width:820px){.appbar::before,.appbar::after{`+
    `height:${V.m.h}%;left:${V.m.x}%;top:${V.m.y}%;`+
    `transform:translate(-50%,-50%) scaleX(${V.m.sx}) skewX(${V.m.sk}deg)}`+
    `${V.m.bar?`.appbar{height:${V.m.bar}px}`:""}}`;
}

function init(){
  loadState();
  renderHome();
  /* candlelight mode — explicit choice, remembered on this device */
  const applyTheme=(t)=>{
    if(t==="dark") document.documentElement.dataset.theme="dark";
    else delete document.documentElement.dataset.theme;
    const b=$("#btn-theme"); if(b) b.textContent = t==="dark" ? "☀️" : "🕯";
  };
  applyTheme(localStorage.getItem("ps.theme"));
  $("#btn-theme").addEventListener("click",()=>{
    const next = document.documentElement.dataset.theme==="dark" ? "light" : "dark";
    localStorage.setItem("ps.theme",next); applyTheme(next);
  });
  wirePostcards();
  wireLiveFilter();
  wireDocsDlg();
  wireDepartures();
  $("#btn-cloud").addEventListener("click",openCloudDlg);
  cloudInit();
  addEventListener("resize",refitMap);
  $("#cmp-start").addEventListener("click",cmpStart);
  /* share-to-Pathseeker: a confirmation email shared from Gmail lands straight in paste-import */
  try{
    const q=new URLSearchParams(location.search);
    const shared=[q.get("s_title"),q.get("s_text"),q.get("s_url")].filter(Boolean).join("\n");
    if(shared){
      history.replaceState(null,"",location.pathname);
      setTimeout(()=>{
        showApp();
        openPasteDlg();
        $("#paste-txt").value=shared;
        toast("Shared text ready — hit Import");
      },400);
    }
  }catch(e){}
  /* tap any currency chip to flip € ⇄ $ everywhere */
  document.addEventListener("click",e=>{
    const t=e.target.closest && e.target.closest("[data-curtog]");
    if(t) setCur(CUR==="EUR"?"USD":"EUR");
  });
  /* keep the rate fresh for the whole app, not just the Translate tab */
  fxFetch();
  /* tap any weather chip to flip °F/°C everywhere */
  document.addEventListener("click",e=>{
    if(e.target.closest && e.target.closest(".wx-chip")){
      WX_UNIT = WX_UNIT==="F" ? "C" : "F";
      localStorage.setItem("ps.unit",WX_UNIT);
      fillWxSlots(document);
    }
  });
  docsInit().then(()=>{ const v=$("#view-plan"); if(v && !v.classList.contains("hidden")) renderPlan(); });
  buildMapInto($("#home-minimap"), false).setAttribute("preserveAspectRatio","xMidYMid slice");
  /* scrapbook parchment backgrounds per tab, under a theme-aware veil (--pveil) */
  const TAB_BG = {today:BG_TODAY, plan:BG_PLAN, itin:BG_ITIN, translate:BG_TRANSLATE, journal:BG_JOURNAL};
  for(const k in TAB_BG)
    $("#view-"+k).style.backgroundImage = `linear-gradient(var(--pveil),var(--pveil)), url(${TAB_BG[k]})`;
  /* banner header + parchment card texture — injected as a stylesheet so it survives
     re-renders (data URIs can't live in the static CSS) */
  const skin=document.createElement("style");
  applySkin(skin);
  document.head.appendChild(skin);
  $("#btn-start").addEventListener("click",()=>{
    const s=$("#trip-start").value, e=$("#trip-end").value;
    if(!s||!e||e<s){ toast("Check your dates — depart must follow arrive"); return; }
    S.trip.startDate=s; S.trip.endDate=e;
    S.trip.arrivalCity=$("#trip-in").value; S.trip.departureCity=$("#trip-out").value;
    mutate(); showApp();
  });
  $("#btn-home").addEventListener("click",showHome);
  $$(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.view)));
  $$(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    UI.filter=ch.dataset.filter;
    $$(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c===ch)));
    renderPanel();
  }));
  initStopDlg(); initBookingDlg(); initPasteDlg(); initPhotos(); initSync();
  updateSyncUI();
  mcpInit();
  photoLoadAll().then(()=>{
    if(!$("#app").classList.contains("hidden")) renderAll();
  });
}
init();
</script>
