<title>Pathseeker · Italia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F5F1E6; --surface:#FDFBF4; --surface2:#EDE7D6; --ink:#2C281E; --ink-soft:#6F6752;
  --line:#D9D1BB; --sea:#B7CFD0; --sea-deep:#A3C0C2; --land:#E9E2C9; --land-line:#C6BC9D;
  --accent:#BE1E3C; --accent-soft:#F3D9DC; --accent-ink:#FFF7EF;
  --olive:#5F6F3E; --olive-soft:#E3E6D2; --gold:#B8862B;
  --train:#3E6F8F; --ferry:#4A7C7C;
  --pveil:rgba(250,246,235,.42); /* veil over parchment tab backgrounds */
  --shadow:0 10px 30px rgba(46,42,32,.16); --shadow-sm:0 2px 8px rgba(46,42,32,.10);
  --focus:#1D5FA0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    /* Parchment skin is the app's single committed look (user choice 2026-08-10):
       dark scheme mirrors the light tokens so cards stay aged-paper with sepia ink. */
    --bg:#F5F1E6; --surface:#FDFBF4; --surface2:#EDE7D6; --ink:#2C281E; --ink-soft:#6F6752;
    --line:#D9D1BB; --sea:#B7CFD0; --sea-deep:#A3C0C2; --land:#E9E2C9; --land-line:#C6BC9D;
    --accent:#BE1E3C; --accent-soft:#F3D9DC; --accent-ink:#FFF7EF;
    --olive:#5F6F3E; --olive-soft:#E3E6D2; --gold:#B8862B;
    --train:#3E6F8F; --ferry:#4A7C7C;
    --pveil:rgba(250,246,235,.42);
    --shadow:0 10px 30px rgba(46,42,32,.16); --shadow-sm:0 2px 8px rgba(46,42,32,.10);
    --focus:#1D5FA0;
  }
}
/* candlelight mode — warm night palette behind the same parchment artwork.
   Explicit toggle only (🕯 in the appbar); system dark preference does NOT force it. */
:root[data-theme="dark"]{
  --bg:#171008; --surface:#251A0E; --surface2:#312412; --ink:#EAD9B4; --ink-soft:#B3A17D;
  --line:#4C3C22; --sea:#B7CFD0; --sea-deep:#A3C0C2; --land:#E9E2C9; --land-line:#C6BC9D;
  --accent:#D84A63; --accent-soft:#45202A; --accent-ink:#FFF3E4;
  --olive:#93A95E; --olive-soft:#333A20; --gold:#D2A44A;
  --train:#7FA8C4; --ferry:#7FB0B0;
  --pveil:rgba(20,13,6,.80);
  --shadow:0 10px 30px rgba(0,0,0,.55); --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --focus:#8FB8E8;
}
/* the home scroll & practical maps stay bright artwork — pin light ink locally */
:root[data-theme="dark"] .home-card{
  --surface:#FDFBF4; --surface2:#EDE7D6; --ink:#2C281E; --ink-soft:#6F6752; --line:#D9D1BB;
  color:var(--ink);
}
:root[data-theme="dark"] .st-pill.st-booked{color:#B5CC7E}
:root[data-theme="dark"] .st-pill.st-researching{color:#D2A44A}
:root[data-theme="dark"] .st-pill.st-held{color:#E08A6E}
:root[data-theme="dark"] .stamp.inked{border-color:#C75A70;color:#C75A70}
:root[data-theme="dark"] .postcard{background:#31261A}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Bodoni 72",Didot,"Bodoni MT","Playfair Display",Georgia,serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;border-radius:6px;
}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
.label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;
}
.hidden{display:none !important}
::placeholder{color:var(--ink-soft);opacity:.7}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn-quiet:hover{color:var(--ink);box-shadow:none;background:var(--surface2)}
.btn-danger{color:var(--accent);border-color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* ---------- home ---------- */
#home{
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  padding:32px 20px;position:relative;overflow:hidden;
}
#home-minimap{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.5;
}
/* the backdrop map covers the whole panel — 'slice' crops rather than letterboxing,
   so a portrait phone never shows voids around the landscape artwork */
#home-minimap svg{width:100%;height:100%;display:block}
/* setup card is the painted scroll (BG_SCROLL via skin); art carries the wordmark */
.home-card{
  position:relative;width:min(470px,100%);
  background:none;border:none;border-radius:14px;box-shadow:none;
  padding:150px 58px 132px;
  filter:drop-shadow(0 18px 36px rgba(22,14,4,.5));
}
.home-card .wordmark{display:none}
.wordmark{
  font-size:44px;line-height:1;font-weight:600;letter-spacing:.01em;margin-bottom:2px;
}
.wordmark .path{color:var(--accent)}
.home-tag{
  font-style:italic;color:var(--ink-soft);margin:0 0 20px;text-align:center;
  font-family:"Bodoni 72",Didot,Georgia,serif;font-size:17px;
}
@media (max-width:520px){
  .home-card{padding:146px 34px 76px}
}
.field{margin-bottom:14px}
.field .label{display:block;margin-bottom:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;
  background:var(--surface);display:flex;flex-direction:column;gap:1px;
}
.dest strong{font-size:14px}
.dest small{color:var(--ink-soft);font-size:11.5px}
.dest[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dest:disabled{opacity:.45;cursor:default}
.home-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.home-resume{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:13.5px;color:var(--ink-soft);
}

/* ---------- app shell ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
/* Painted PATHSEEKER banner header (BG_BANNER applied in init()) */
.appbar{
  position:relative;display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;
  padding:0 14px 10px;flex:none;z-index:30;
  /* banner asset is pre-cropped to its title band (aspect ~3.96:1); height tracks viewport
     width so the full PATHSEEKER title always fits the header */
  height:clamp(96px,10.5vw,164px);
  /* two layers set by the injected skin: PATHSEEKER logo (alpha PNG) over the painted scene */
  background-color:#120d06;
  border-bottom:2px solid #3a2c16;
}
.appbar .wordmark-sm{display:none}
#btn-home{position:absolute;left:0;top:0;bottom:0;width:32%;z-index:1;border-radius:0}
.trip-chip{
  position:absolute;left:14px;bottom:8px;z-index:2;font-size:12px;line-height:1.25;
  color:#EFE3C6;background:rgba(20,14,6,.62);padding:4px 11px;border-radius:8px;
  pointer-events:none;
}
.tabs{display:flex;gap:2px;background:rgba(20,14,6,.62);border-radius:10px;padding:3px;
  position:relative;z-index:2;backdrop-filter:blur(2px)}
.tab{
  padding:7px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:#D9C9A6;
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.sync-btn{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:8px 13px;border:1px solid rgba(233,215,171,.3);border-radius:10px;color:#D9C9A6;
  background:rgba(20,14,6,.62);position:relative;z-index:2;backdrop-filter:blur(2px);
}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--olive);flex:none}
.sync-dot.dirty{background:var(--gold)}
.main{flex:1;min-height:0;position:relative}

/* ---------- map view ---------- */
#view-map{position:absolute;inset:0;display:flex;--margin-w:186px}
/* the map is fixed hand-painted artwork — stage chrome is art-toned in both themes */
.map-stage{flex:1;min-width:0;position:relative;z-index:1;background:transparent;overflow:hidden;
  margin-left:calc(var(--margin-w) * -1)}
.map-stage > svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sea-label{
  font-family:"Bodoni 72",Didot,Georgia,serif;font-style:italic;
  fill:var(--sea-deep);letter-spacing:.25em;
}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2;stroke-linejoin:round}
.graticule{stroke:var(--sea-deep);stroke-width:.6;stroke-dasharray:1 5;fill:none;opacity:.8}
.route{
  fill:none;stroke:#C8202F;stroke-width:6;stroke-dasharray:16 11;
  stroke-linecap:round;stroke-linejoin:round;opacity:.92;
  filter:drop-shadow(0 0 3px rgba(20,12,2,.65));
}
@media (prefers-reduced-motion: no-preference){
  .route{animation:march 40s linear infinite}
  @keyframes march{to{stroke-dashoffset:-1000}}
}
.city{cursor:pointer}
.city circle.halo{fill:rgba(0,0,0,0);stroke:none} /* transparent but hit-testable — the tap target */
.city circle.dot{fill:rgba(26,18,6,.18);stroke:#E8D9B0;stroke-width:2.5}
.city.in-trip circle.dot{fill:#BE1E3C;stroke:#F3E7C9}
.city.selected circle.halo{fill:none;stroke:#F3E7C9;stroke-width:3.5}
.city text{
  font-family:"Bodoni 72",Didot,Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.02em;
  fill:#F3E7C9;paint-order:stroke;stroke:rgba(26,18,6,.85);stroke-width:7px;stroke-linejoin:round;
}
.city.gateway text{font-weight:700}
.city .plane{fill:#F3E7C9;font-size:20px;font-family:inherit;paint-order:stroke;stroke:rgba(26,18,6,.85);stroke-width:5px}
/* the left margin: an illuminated-manuscript list, no box — it fades into the map */
.map-side{
  width:var(--margin-w);flex:none;display:flex;flex-direction:column;gap:2px;
  padding:20px 12px 20px 18px;overflow-y:auto;z-index:3;
  background:none;border-right:none;box-shadow:none;position:relative;
}
/* dims the painting only where the list sits; the overhang stays vivid */
.map-side::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(12,8,3,.80) 0%,
    rgba(12,8,3,.70) 44.5%,
    rgba(12,8,3,0) 81%);
}
/* the painted banner, cut free of its glow and draped across the panel's edge */
.side-art{
  position:absolute;left:-22px;top:-41px;bottom:-57px;
  width:226px;z-index:2;
  pointer-events:none;background-size:100% 100%;background-repeat:no-repeat;
  filter:drop-shadow(6px 2px 15px rgba(8,4,1,.6));
}
.side-label{
  font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(233,215,171,.5);margin:12px 0 4px 6px;
}
.side-label:first-child{margin-top:0}
.map-side .chips{display:flex;flex-direction:column;gap:1px;pointer-events:auto}
.map-side .chip{
  appearance:none;background:none;border:none;box-shadow:none;border-radius:8px;
  text-align:left;padding:6px 8px 6px 22px;position:relative;
  font-family:"Bodoni 72",Didot,Georgia,serif;font-size:17px;font-weight:700;
  letter-spacing:.03em;color:#E4D3AB;cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.6);
  transition:color .15s ease;
}
.map-side .chip:hover{color:#FFF4DC}
.map-side .chip[aria-pressed="true"]{color:#F0C465;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(240,196,101,.35)}
.map-side .chip[aria-pressed="true"]::before{
  content:"✦";position:absolute;left:4px;top:50%;transform:translateY(-50%);
  font-size:12px;color:#F0C465;
}
.zoom-ctl{
  position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5;
}
.zoom-ctl button{
  width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:18px;font-weight:600;box-shadow:var(--shadow-sm);color:var(--ink);
}
.map-hint{
  position:absolute;left:calc(var(--margin-w) + 12px);bottom:14px;z-index:5;font-size:12px;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  box-shadow:var(--shadow-sm);max-width:min(70vw,560px);
}
.map-hint a{font-weight:700}
/* practical (non-storybook) map showing: hide trip overlay + POI filters */
.map-stage.xmap .city,.map-stage.xmap .route,.map-stage.xmap .route-done,
.map-stage.xmap .day-scrub{display:none !important}
#view-map.xmap #poi-filter,#view-map.xmap #poi-label{display:none}
/* live GPS map (Leaflet on the hosted site; graceful note in the artifact) */
#live-map{position:absolute;inset:0;z-index:4;background:#E8E0CE}
#live-map .leaflet-top.leaflet-left{margin-left:calc(var(--margin-w) + 4px)}
.map-stage.livemap > svg,.map-stage.livemap .zoom-ctl{display:none !important}
.live-note{max-width:420px;margin:80px auto 0;padding:22px 26px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:14.5px;line-height:1.55;color:var(--ink)}
#live-map .leaflet-container{font:inherit}
.live-locate{
  position:absolute;right:12px;bottom:64px;z-index:1000;width:38px;height:38px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);font-size:17px;box-shadow:var(--shadow-sm);cursor:pointer;
}

/* ---------- city panel ---------- */
.panel{
  position:relative;width:390px;flex:none;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:10;
}
.panel-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.panel-head .region{margin-bottom:2px}
.panel-head h2{font-size:30px;font-weight:600;line-height:1.05}
.panel-head .tagline{
  font-family:"Bodoni 72",Didot,Georgia,serif;font-style:italic;color:var(--ink-soft);
  font-size:15.5px;margin-top:4px;
}
.panel-close{position:absolute;top:14px;right:14px;font-size:20px;color:var(--ink-soft);padding:4px 8px}
.panel-status{
  margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:var(--olive-soft);color:var(--olive);
}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.panel-body{flex:1;overflow-y:auto;padding:8px 20px 20px;overscroll-behavior:contain}
.poi-section{margin-top:16px}
.poi-section > .label{display:flex;align-items:center;gap:8px}
.poi-section > .label::after{content:"";flex:1;border-top:1px solid var(--line)}
.poi{
  display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted var(--line);
}
.poi:last-child{border-bottom:none}
.poi-txt{flex:1;min-width:0}
.poi-txt strong{font-size:14.5px;font-weight:600}
.poi-txt p{margin:1px 0 0;font-size:13px;color:var(--ink-soft)}
.poi-txt .cat{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.poi-acts{display:flex;gap:4px;flex:none;margin-top:2px}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-soft);font-size:14px;text-decoration:none;
}
.icon-btn:hover{color:var(--ink);box-shadow:var(--shadow-sm)}
.panel-cta{
  padding:10px 18px 16px;display:flex;gap:10px;background:transparent;border-top:none;
}
.panel-cta .btn{flex:1}
/* the wax-sealed ribbon CTA — the label is pinned to the banner, right of the seal.
   Band measured from the art: x 38–88% (centre 63%), y 35–66% (centre 50.5%). */
.btn-ribbon{
  position:relative;aspect-ratio:2056/601;width:100%;max-width:430px;margin:0 auto;
  border:none;box-shadow:none;border-radius:0;padding:0;
  background:center/100% 100% no-repeat;
  filter:drop-shadow(0 5px 12px rgba(30,14,4,.38));
  transition:filter .15s ease,transform .15s ease;
}
.btn-ribbon span{
  position:absolute;left:63%;top:50.5%;transform:translate(-50%,-50%);max-width:50%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:"Bodoni 72",Didot,Georgia,serif;font-weight:700;letter-spacing:.01em;
  font-size:clamp(11.5px,3.2vw,14.5px);line-height:1.1;text-align:center;
  color:#48310F;text-shadow:0 1px 0 rgba(255,248,226,.55);
}
.btn-ribbon:hover{filter:drop-shadow(0 8px 16px rgba(30,14,4,.48)) brightness(1.05);transform:translateY(-1px)}
.btn-ribbon:active{transform:translateY(1px)}
.book-block{
  margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  background:var(--surface2);
}
.book-block .label{display:block;margin-bottom:8px}
.book-row{display:flex;gap:7px;flex-wrap:wrap}
.book-row .btn{flex:1;min-width:90px;text-decoration:none;background:var(--surface)}
.book-block .after{
  margin:10px 0 0;font-size:12.5px;color:var(--ink-soft);
}
.book-block .after button{
  color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;
}
/* postcards strip — little polaroids of the town */
.postcards{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px;margin-top:6px}
.postcard{flex:none;width:152px;background:#FBF6E8;border:1px solid var(--line);border-radius:4px;
  padding:6px 6px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transform:rotate(-1.8deg);
  transition:transform .15s ease}
.postcard:nth-child(even){transform:rotate(1.5deg)}
.postcard:hover{transform:rotate(0) scale(1.04);box-shadow:var(--shadow)}
.postcard img{width:100%;height:102px;object-fit:cover;display:block}
#dlg-postcard{width:min(640px,calc(100vw - 24px))}
.pc-frame{position:relative;border-radius:16px 16px 0 0;overflow:hidden}
#pc-img{width:100%;max-height:60vh;object-fit:contain;display:block;background:#141008;cursor:pointer}
.pc-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:60px;border:none;
  border-radius:10px;background:rgba(20,14,6,.45);color:#F3E7C9;font-size:32px;line-height:1;
  font-family:Georgia,serif;cursor:pointer;
}
.pc-nav:hover{background:rgba(20,14,6,.72)}
#pc-prev{left:10px}
#pc-next{right:10px}
.pc-count{
  position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:700;color:#F3E7C9;
  background:rgba(20,14,6,.55);padding:3px 10px;border-radius:999px;pointer-events:none;
}
.travel-note{
  margin-top:16px;background:var(--surface2);border-radius:10px;padding:11px 13px;
  font-size:13px;color:var(--ink-soft);
}
.travel-note b{color:var(--ink)}

/* ---------- print: a clean paper itinerary from the Plan tab ---------- */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#f2ede0;--ink:#1c1810;--ink-soft:#555;--line:#bbb;
    --shadow:none;--shadow-sm:none;--pveil:rgba(255,255,255,0)}
  .appbar,.mob-tabs,.plan-nav,.leg-acts,.agent-check,.chk-price,.doc-clip,.wx-chip,
  .agent-intro,.agent-progress,#btn-print,.postcards{display:none !important}
  html,body,.app,.main{height:auto !important;overflow:visible !important;position:static !important}
  #view-plan{position:static !important;overflow:visible !important;background:none !important}
  .plan-wrap{max-width:none;padding:0}
  .plan-hero{color:#1c1810;text-shadow:none;background-image:none !important;padding:10px 0 18px;text-align:left}
  .plan-hero .dates{border-color:#999}
  .plan-day,.plan-panel,.plan-route,.plan-fact,.plan-gem{background-image:none !important;border:1px solid #ccc;box-shadow:none}
  .plan-day{page-break-inside:avoid}
  .plan-day-head{background:none !important;color:#1c1810;text-shadow:none}
  .plan-section{page-break-before:auto}
  .st-pill{border:1px solid #999;background:none}
  a{text-decoration:none;color:inherit}
}
/* ---------- itinerary ---------- */
#view-itin,#view-journal,#view-today,#view-translate,#view-plan{
  position:absolute;inset:0;overflow-y:auto;
  background-size:cover;background-position:center;
}
/* ---------- translate ---------- */
.phrase{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line)}
.phrase:last-child{border-bottom:none}
.phrase .p-txt{flex:1;min-width:0}
.phrase .p-it{font-weight:700;font-size:15px}
.phrase .p-en{font-size:12.5px;color:var(--ink-soft)}
.menu-term{display:flex;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px dotted var(--line);align-items:baseline}
.menu-term:last-child{border-bottom:none}
.menu-term b{flex:none;min-width:118px}
.menu-term span{color:var(--ink-soft)}
.tr-search{margin:14px 0 18px}
.tr-search input{font-size:16px;padding:12px 14px;border-radius:12px}
.sheet-wrap{max-width:860px;margin:0 auto;padding:26px 20px 80px}
.view-title{font-size:34px;font-weight:600;margin-bottom:4px}
.view-sub{color:var(--ink-soft);margin:0 0 22px;font-size:14.5px}
.day-row.edge{opacity:.92}
.edge-label{font-style:italic;color:var(--ink-soft);font-weight:600}
.day-row{
  display:grid;grid-template-columns:86px 1fr;gap:16px;padding:14px 0;
  border-top:1px solid var(--line);
}
.day-date{text-align:right}
.day-date .dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.day-date .num{font-size:24px;font-weight:600;line-height:1.1}
.day-date .mon{font-size:12px;color:var(--ink-soft)}
.day-city{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.day-city .name{font-weight:700;font-size:15.5px}
.day-city .transfer{color:var(--accent);font-weight:600;font-size:13px}
.day-city .unassigned{color:var(--ink-soft);font-style:italic;font-size:13.5px}
.day-items{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.bk{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13.5px;cursor:pointer;
}
.bk:hover{box-shadow:var(--shadow-sm)}
.bk .type-dot{width:9px;height:9px;border-radius:50%;flex:none}
.bk .bk-docs-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk-doccount{font-size:12px;font-weight:700;color:#4C6B23}
:root[data-theme="dark"] .bk-doccount{color:#B5CC7E}
.bk-route{color:var(--ink);font-weight:700}
.bk-note{
  flex-basis:100%;order:9;margin:4px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.bk-name{font-weight:600}
.bk .bk-meta{color:var(--ink-soft);font-size:12.5px}
.bk .spacer{flex:1}
.bk a{color:var(--ink-soft);text-decoration:none;font-size:13px}
.day-add{margin-top:7px}
.empty{
  border:1.5px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;
  color:var(--ink-soft);font-size:14px;
}

/* ---------- journal ---------- */
.j-group{margin-bottom:26px}
.j-city-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.j-city-head h3{font-size:22px;font-weight:600}
.j-city-head .d{color:var(--ink-soft);font-size:13px}
.j-note{
  background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:6px;
  display:flex;gap:10px;align-items:baseline;
}
.j-note .jd{flex:none;font-size:12px;color:var(--ink-soft)}
.j-note .spacer{flex:1}
.journal-form{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:24px;display:grid;gap:10px;
}
.journal-form .row{display:grid;grid-template-columns:150px 1fr auto;gap:10px}

/* ---------- today ---------- */
.t-transfer{
  background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 16px;
  font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  font-size:14px;
}
.t-transfer a{color:inherit}
.t-count{font-size:64px;font-weight:600;line-height:1}
.t-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.t-card .label{display:block;margin-bottom:7px}
.t-card .big{font-size:19px;font-weight:700}
.t-card p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}
.t-card .t-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.quick-row input{width:auto;flex:1;min-width:150px}
.ess{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 18px 10px}
.ess summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:15px}
.ess h4{margin:14px 0 4px;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.ess p,.ess li{font-size:13.5px;color:var(--ink-soft);margin:2px 0}
.ess ul{margin:4px 0;padding-left:18px}
.ess b{color:var(--ink)}
.exp-row{display:flex;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.exp-row .d{color:var(--ink-soft);flex:none;font-size:12px;width:56px}
.exp-row .lbl{flex:1;min-width:0}
.exp-row .amt{font-weight:700;font-variant-numeric:tabular-nums}
.transfer-chip{
  display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;margin-top:6px;
}
.transfer-chip a{color:inherit}

/* ---------- trip mode & photos ---------- */
.day-nav{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.day-nav .arrow{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font-size:17px;font-weight:700;color:var(--ink);
}
.day-nav .arrow:disabled{opacity:.35;cursor:default}
.day-nav .day-sub{color:var(--ink-soft);font-size:14.5px}
.day-scrub{
  position:absolute;left:calc(50% + var(--margin-w) / 2);transform:translateX(-50%);bottom:14px;z-index:6;
  display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px 6px;box-shadow:var(--shadow-sm);
}
.day-scrub button{
  width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:700;color:var(--ink);
}
.day-scrub button:disabled{opacity:.3;cursor:default}
.day-scrub .ds-label{font-size:12.5px;font-weight:700;padding:0 8px;white-space:nowrap}
.city.visited circle.dot{fill:#6B7A3E;stroke:#F3E7C9}
.city.current circle.dot{fill:#BE1E3C;stroke:#F3E7C9}
.city.current circle.halo{fill:none;stroke:#C8202F;stroke-width:4}
@media (prefers-reduced-motion: no-preference){
  .city.current circle.halo{animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{r:16;opacity:.9}70%{r:40;opacity:0}100%{r:40;opacity:0}}
}
.route-done{
  fill:none;stroke:#C8202F;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 3px rgba(20,12,2,.65));
}
.pbadge circle{fill:#B8862B;stroke:#F3E7C9;stroke-width:3}
.pbadge text{fill:#FFF7E4;font-size:17px;font-weight:700;font-family:"Avenir Next",Avenir,system-ui,sans-serif;stroke:none}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
.photo-thumb{
  aspect-ratio:1;object-fit:cover;width:100%;border-radius:9px;cursor:pointer;display:block;
  border:1px solid var(--line);
}
#dlg-photo{width:min(560px,calc(100vw - 24px))}
#ph-img{width:100%;max-height:58vh;object-fit:contain;display:block;background:#101010;border-radius:16px 16px 0 0}

/* ---------- dialogs ---------- */
dialog{
  border:none;border-radius:16px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);padding:0;width:min(430px,calc(100vw - 32px));
}
dialog::backdrop{background:rgba(20,18,12,.45);backdrop-filter:blur(2px)}
.dlg-head{padding:18px 22px 0}
.dlg-head h3{font-size:23px;font-weight:600}
.dlg-head p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px}
.dlg-body{padding:16px 22px;display:grid;gap:12px}
.dlg-foot{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.type-opt{
  border:1px solid var(--line);border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;
  color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;
}
.type-opt .type-dot{width:10px;height:10px;border-radius:50%}
.type-opt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface2)}
.nights-note{font-size:12.5px;color:var(--ink-soft)}

/* ---------- sync modal ---------- */
.sync-row{
  display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);
}
.sync-row:last-child{border-bottom:none}
.sync-row .t{flex:1}
.sync-row .t strong{font-size:14px}
.sync-row .t p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft)}
.sync-msg{font-size:13px;border-radius:9px;padding:9px 12px;background:var(--surface2)}
.sync-msg.err{background:var(--accent-soft);color:var(--accent)}
.sync-msg.ok{background:var(--olive-soft);color:var(--olive)}
.drive-banner{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;
  background:var(--ink);color:var(--bg);border-radius:12px;box-shadow:var(--shadow);
  padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:13.5px;
  width:min(480px,calc(100vw - 24px));
}
.drive-banner .btn{background:var(--bg);color:var(--ink);border:none;padding:7px 14px;font-size:13px}
.drive-banner .btn-quiet{background:transparent;color:var(--bg);opacity:.75}

/* ---------- toast ---------- */
#toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;
  transition:opacity .25s ease;pointer-events:none;max-width:calc(100vw - 32px);
}
#toast.show{opacity:1}

/* ---------- mobile ---------- */
.mob-tabs{display:none}
@media (max-width:820px){
  .appbar{padding:0 12px 8px;height:clamp(70px,20vw,100px)}
  .appbar .tabs{display:none}
  .trip-chip{display:none}
  /* phones: the sync pill goes (it lives in Today's quick row instead) and the
     candlelight toggle takes the top-right corner on its own */
  #btn-sync{display:none}
  #btn-theme{margin-left:auto;padding:8px 11px;font-size:15px}
  .mob-tabs{
    display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30;
  }
  .mob-tabs .tab{flex:1;text-align:center;padding:9px 2px;font-size:12.5px}
  #view-map{flex-direction:column}
  .side-art{display:none}
  #view-map{--margin-w:0px}
  .map-side{
    width:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;
    padding:8px 12px;border-right:none;border-bottom:1px solid rgba(233,215,171,.18);
    background:linear-gradient(180deg,#1c1409,#120c05);
  }
  .map-side .chips{flex-direction:row;flex-wrap:nowrap}
  .map-side .chip{white-space:nowrap;font-size:15px;padding:4px 6px 4px 18px}
  .side-label{display:none}
  .panel{
    position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;max-height:66%;
    border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
  }
  .panel-head{padding-top:10px}
  .panel-head::before{
    content:"";display:block;width:40px;height:4px;border-radius:2px;
    background:var(--line);margin:0 auto 10px;
  }
  .day-row{grid-template-columns:64px 1fr;gap:12px}
  .journal-form .row{grid-template-columns:1fr}
  .view-title{font-size:28px}
}
/* ---- Plan tab (fairy-tale guide + concierge) ---- */
.plan-wrap{max-width:1000px;margin:0 auto;padding:0 0 80px}
/* brush-edged painting floats straight on the parchment — no box, no scrim */
.plan-hero{background:none;color:var(--accent-ink);
  padding:56px 48px 68px;text-align:center;position:relative;overflow:hidden;
  background-size:100% 100%;background-repeat:no-repeat;background-position:center;
  text-shadow:0 1px 3px rgba(24,12,4,.8),0 0 24px rgba(24,12,4,.55)}
.plan-hero>*{position:relative;z-index:1}
.plan-kicker{letter-spacing:.32em;text-transform:uppercase;font-size:11px;font-weight:700;opacity:.9}
.plan-hero h1{font-size:clamp(26px,4.4vw,42px);margin:12px 0 6px;font-weight:600;line-height:1.12}
.plan-hero .sub{font-style:italic;font-size:16px;opacity:.95}
.plan-hero .dates{margin-top:16px;display:inline-block;border:1px solid currentColor;
  border-radius:30px;padding:7px 18px;font-size:13.5px;font-weight:600;opacity:.95}
.plan-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:-30px 20px 0;position:relative;z-index:3}
.plan-fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;
  text-align:center;box-shadow:var(--shadow-sm)}
.plan-fact .n{font-size:22px;font-weight:800;color:var(--accent)}
.plan-fact .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.plan-nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;gap:8px;overflow-x:auto;margin-top:24px}
.plan-nav a{white-space:nowrap;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink-soft);
  padding:6px 13px;border-radius:20px}
.plan-nav a:hover{background:var(--accent);color:var(--accent-ink)}
.plan-section{padding:30px 20px 4px}
.plan-section h2{font-size:26px;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.plan-section h2:before{content:"";width:34px;height:3px;background:var(--gold);border-radius:2px;flex:none}
.plan-lead{color:var(--ink-soft);margin:0 0 18px;font-size:15px}
.plan-route{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow-sm)}
.plan-leg{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.plan-leg:last-child{border-bottom:none}
.plan-leg .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.plan-leg .body{flex:1;min-width:0}
.plan-leg .place{font-weight:700}
.plan-leg .meta{font-size:13.5px;color:var(--ink-soft);margin-top:1px}
.plan-tag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  color:#fff;padding:2px 9px;border-radius:20px;margin-left:7px;vertical-align:middle;background:var(--olive)}
.plan-tag.car{background:var(--accent)} .plan-tag.train{background:var(--train)} .plan-tag.ferry{background:var(--ferry)}
.plan-day{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);
  margin:20px 0;overflow:hidden}
.plan-day-head{background:linear-gradient(100deg,var(--accent),var(--gold));color:var(--accent-ink);
  text-shadow:0 1px 3px rgba(24,12,4,.7);
  padding:16px 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;cursor:pointer}
.plan-day-head .dnum{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.9;width:100%;font-weight:700}
.plan-day-head h3{font-size:24px;font-weight:600}
.plan-day-head .when{font-size:13.5px;opacity:.95;font-weight:600}
.plan-day-head .nights{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);
  padding:4px 12px;border-radius:20px}
.plan-day-head .pencil{font-size:14px;opacity:.85}
.plan-day-body{padding:18px 22px}
.plan-vibe{font-style:italic;color:var(--olive);border-left:3px solid var(--gold);padding-left:14px;margin-bottom:14px;
  font-family:"Bodoni 72",Didot,Georgia,serif;font-size:16px}
.plan-drive{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px}
.plan-drive b{color:var(--ink)}
.plan-blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plan-block h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.plan-block ul{list-style:none;margin:0;padding:0}
.plan-block li{padding:5px 0 5px 16px;position:relative;font-size:14px}
.plan-block li:before{content:"›";position:absolute;left:0;color:var(--gold);font-weight:700}
.plan-price{font-size:10.5px;color:#fff;background:var(--gold);padding:1px 7px;border-radius:10px;

  padding:11px 15px;margin-top:14px;font-size:13.5px}

.plan-gems{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan-gem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow-sm)}
.plan-gem .em{color:var(--gold);font-size:18px}
.plan-gem h4{color:var(--ink);margin:4px 0 5px;font-size:15px}
.plan-gem p{font-size:13px;color:var(--ink-soft);margin:0}
.plan-flex-item{border-left:3px solid var(--olive);padding:4px 0 4px 14px;margin:12px 0;font-size:14px}
.plan-flex-item b{color:var(--olive)}
.plan-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow-sm)}
.plan-panel h3{font-size:16px;color:var(--ink);margin-bottom:8px}
.plan-panel ul{padding-left:18px;margin:0}
.plan-panel li{margin:6px 0;font-size:13.5px;color:var(--ink-soft)}
.plan-panel li b{color:var(--ink)}
.plan-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* concierge */
.agent-intro{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.agent-badge{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:18px}
.agent-intro p{margin:0;font-size:14px;color:var(--ink-soft)}
.agent-progress{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:10px 0 16px}
.agent-progress i{display:block;height:100%;background:var(--olive);border-radius:4px;transition:width .3s ease}
.agent-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--line)}
.agent-item:last-child{border-bottom:none}
.agent-check{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--surface);display:grid;place-items:center;font-size:13px;color:var(--accent-ink);cursor:pointer}
.agent-check[aria-checked="true"]{background:var(--olive);border-color:var(--olive)}
.agent-check:disabled{cursor:default}
.agent-item .t{flex:1;min-width:0}
.agent-item .t strong{font-size:14px}
.agent-item.done .t strong{text-decoration:line-through;color:var(--ink-soft)}
.agent-item .t p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft)}
.agent-item .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
/* booking pipeline: status pill + price */
.agent-item .pipe{display:flex;gap:6px;align-items:center;flex:none}
.st-pill{
  font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;
  min-width:86px;text-align:center;
}
.st-pill.st-researching{border-color:#B8862B;color:#8A6114;background:rgba(184,134,43,.10)}
.st-pill.st-held{border-color:#C96A50;color:#9C4326;background:rgba(201,106,80,.12)}
.st-pill.st-booked{border-color:var(--olive);color:#4C6B23;background:rgba(107,142,52,.14)}
.st-pill.st-paid{border-color:#2E7A55;background:#2E7A55;color:#F6F1E2}
.chk-price{
  width:76px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;
  background:var(--surface);color:var(--ink);text-align:right;
}
.chk-price::placeholder{color:var(--ink-soft);opacity:.6}
.leg-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* live weather chips */
.wx-chip{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;
  background:rgba(20,12,6,.30);color:#F6EDD8;border-radius:999px;padding:2px 10px;
  text-shadow:none;vertical-align:middle;
}
.panel-head .wx-chip{background:var(--surface2);color:var(--ink-soft);margin-left:8px}
/* passport stamps — ink themselves as the trip progresses */
.stamp-grid{display:flex;gap:14px;flex-wrap:wrap;padding:6px 0 2px}
.stamp{
  width:104px;height:104px;border-radius:50%;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2.5px dashed var(--line);color:var(--ink-soft);opacity:.5;
  transform:rotate(var(--rot,0deg));text-align:center;
}
.stamp.inked{
  border:3px double #7E1024;color:#7E1024;opacity:.92;
  box-shadow:inset 0 0 0 1.5px rgba(126,16,36,.25);
  background:radial-gradient(circle at 60% 35%,rgba(126,16,36,.07),transparent 70%);
}
.stamp .s-city{font-family:"Bodoni 72",Didot,Georgia,serif;font-weight:700;font-size:13px;letter-spacing:.08em;max-width:92px}
.stamp .s-date{font-size:10.5px;font-weight:700;letter-spacing:.06em}
.stamp .s-ital{font-size:8.5px;letter-spacing:.28em;opacity:.8}
/* wax seal drop when a booking lands */
.agent-item{position:relative}
.wax-seal{
  position:absolute;right:96px;top:50%;width:46px;height:46px;margin-top:-23px;z-index:6;
  border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#D4405C,#8E1230 62%,#66081F);color:#F3D9DC;font-size:19px;
  box-shadow:0 4px 10px rgba(30,6,10,.45), inset 0 0 0 3px rgba(255,240,220,.14);
  animation:sealdrop .55s cubic-bezier(.2,1.6,.4,1) both, sealfade .45s ease 1s both;
}
@keyframes sealdrop{0%{transform:scale(2.4) rotate(-20deg);opacity:0}55%{transform:scale(.94) rotate(3deg);opacity:1}78%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sealfade{to{opacity:0;transform:scale(.9)}}
.transport-line .leg-acts{flex-wrap:wrap}
/* live timetable dialog */
#dlg-times{width:min(480px,calc(100vw - 24px))}
.time-row{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line);font-size:14px}
.time-row:last-of-type{border-bottom:none}
.time-row b{font-size:16px}
.time-arr{color:var(--ink-soft)}
.time-dur{font-size:11.5px;font-weight:700;background:var(--surface2);border-radius:999px;padding:2px 9px}
.time-name{margin-left:auto;font-size:12.5px;color:var(--ink-soft);text-align:right}
.times-note{font-size:12px;color:var(--ink-soft);margin:10px 0 0}
/* departure boards */
#dlg-departures{width:min(520px,calc(100vw - 24px))}
.dep-stop{
  display:block;width:100%;text-align:left;padding:9px 10px;border:none;border-bottom:1px dotted var(--line);
  background:none;font-size:14px;color:var(--ink);cursor:pointer;border-radius:6px;
}
.dep-stop:hover{background:var(--surface2)}
.dep-mode{font-weight:700;font-size:13px;flex:none}
/* ---------- trip calendar ---------- */
.cal-month{margin:14px 0 22px}
.cal-title{font-size:20px;margin:0 0 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);text-align:center;padding-bottom:2px}
.cal-cell{
  min-height:82px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;
  background:var(--surface);opacity:.5;display:flex;flex-direction:column;gap:2px;
}
.cal-cell.out{border:none;background:none;opacity:1}
.cal-cell.trip{opacity:1;cursor:pointer;background:var(--surface2);border-color:var(--gold)}
.cal-cell.trip:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.cal-cell.moving{border-left:3px solid var(--accent)}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-num{font-size:12px;font-weight:700;color:var(--ink-soft)}
.cal-flag{font-size:9.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.cal-city{font-family:"Bodoni 72",Didot,Georgia,serif;font-size:13px;font-weight:700;line-height:1.15}
.cal-city.none{color:var(--ink-soft);font-weight:400}
.cal-dots{display:flex;gap:3px;align-items:center;margin-top:auto;flex-wrap:wrap}
.cal-dot{width:7px;height:7px;border-radius:50%;flex:none}
.cal-more{font-size:9px;color:var(--ink-soft);font-weight:700}
.cal-note{font-size:9.5px;color:var(--ink-soft)}
.dayd-city{font-family:"Bodoni 72",Didot,Georgia,serif;font-size:22px;font-weight:700}
@media (max-width:820px){
  .cal-grid{gap:3px}
  .cal-cell{min-height:62px;padding:3px 4px;border-radius:8px}
  .cal-city{font-size:11px}
  .cal-num{font-size:10.5px}
  .cal-flag{display:none}
}
/* ---------- wallet: tickets on hand + travel documents ---------- */
.wallet-seg{display:flex;gap:8px;margin:6px 0 14px}
.wseg{
  flex:1;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;
}
.wseg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wallet-note{font-size:13px;color:var(--ink-soft);margin:0 0 10px}
.wallet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}
.wticket{
  border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px;background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.wticket.now{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-sm)}
.wt-top{display:flex;gap:8px;align-items:center}
.wt-name{font-weight:700;font-size:14px;line-height:1.25}
.wt-meta{font-size:12px;color:var(--ink-soft);margin:3px 0 8px}
.wt-conf{
  display:block;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:700;
  letter-spacing:.12em;padding:6px 8px;margin-bottom:8px;border:none;border-radius:8px;
  background:var(--surface2);color:var(--ink);cursor:pointer;
}
.wt-acts{display:flex;gap:6px;flex-wrap:wrap}
#dlg-bigcode{width:min(560px,calc(100vw - 24px))}
.bigcode-wrap{padding:38px 18px;text-align:center;background:#FFFDF6;border-radius:16px 16px 0 0}
#bigcode-txt{
  font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#12100A;
  font-size:clamp(30px,11vw,64px);letter-spacing:.14em;word-break:break-all;line-height:1.15;
}
.doc-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.doc-slot{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.doc-slot.has{border-color:var(--olive)}
.ds-head{display:flex;gap:8px;align-items:baseline}
.ds-head strong{font-size:13.5px;flex:1}
.ds-count{font-size:11px;font-weight:700;background:var(--olive);color:#F6F1E2;border-radius:999px;padding:1px 8px}
.ds-hint{margin:2px 0 8px;font-size:11.5px;color:var(--ink-soft)}
.ds-thumbs{display:flex;gap:8px;flex-wrap:wrap}
.ds-thumb{
  position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;
  border:1px solid var(--line);background:var(--surface2);
}
.ds-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ds-pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;font-weight:700;color:var(--ink-soft)}
.ds-x{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(20,14,6,.72);color:#F3E7C9;font-size:11px;line-height:20px;text-align:center;
}
.ds-add{
  width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--line);background:none;
  color:var(--ink-soft);font-size:19px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.ds-add span{font-size:9.5px;letter-spacing:.02em}
/* golden hour line */
.golden{color:#8A5A14}
:root[data-theme="dark"] .golden{color:#E0B45E}
.plan-day-head+.plan-day-body .golden b{font-weight:700}
/* smart nudge */
.nudge{font-size:13.5px;font-weight:600;margin:2px 0 12px;padding:9px 12px;border-radius:10px;
  background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent)}
/* trip linter */
.lint{padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.lint:last-child{border-bottom:none}
.lint.warn{color:#8E1230;font-weight:600}
:root[data-theme="dark"] .lint.warn{color:#F2938C}
.lint.info{color:var(--ink-soft)}
.lint.ok{color:#4C6B23;font-weight:600}
:root[data-theme="dark"] .lint.ok{color:#B5CC7E}
/* undo toast */
.toast-undo{margin-left:10px;padding:3px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.5);
  background:none;color:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
/* compass mode */
.cmpn-rose{
  position:relative;width:210px;height:210px;margin:0 auto;border-radius:50%;
  border:3px double var(--gold);background:radial-gradient(circle at 50% 42%,var(--surface2),var(--surface) 75%);
  box-shadow:var(--shadow-sm), inset 0 0 24px rgba(90,60,20,.15);
}
.cmpn-card{position:absolute;font-family:"Bodoni 72",Didot,Georgia,serif;font-weight:700;color:var(--ink-soft);font-size:14px}
.cmpn-n{top:8px;left:50%;transform:translateX(-50%);color:#8E1230;font-size:16px}
.cmpn-s{bottom:8px;left:50%;transform:translateX(-50%)}
.cmpn-e{right:10px;top:50%;transform:translateY(-50%)}
.cmpn-w{left:10px;top:50%;transform:translateY(-50%)}
.cmpn-needle{
  position:absolute;left:50%;top:50%;transform-origin:50% 100%;transform:translate(-50%,-100%);
  font-size:64px;line-height:1;color:#8E1230;text-shadow:0 2px 6px rgba(30,10,4,.35);
  transition:transform .25s ease;height:86px;pointer-events:none;
}
.cmpn-info{margin-top:12px;font-size:15px}
#cmp-target{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
/* print pack */
.print-pack{display:none}
@media print{
  body.pp-mode #app,body.pp-mode #home,body.pp-mode dialog,body.pp-mode #toast{display:none !important}
  body.pp-mode .print-pack{display:block !important;color:#111;font-size:12px;line-height:1.45}
  .print-pack h1{font-size:20px;margin:0 0 2px}
  .print-pack h2{font-size:15px;margin:16px 0 6px;border-bottom:1.5px solid #333;padding-bottom:2px}
  .print-pack h3{font-size:13px;margin:0 0 3px}
  .print-pack .pp-sub{color:#555;margin:0 0 8px}
  .print-pack .pp-day{page-break-inside:avoid;padding:6px 0;border-bottom:1px dotted #bbb}
  .print-pack ul{margin:2px 0 0 16px;padding:0}
  .print-pack .pp-note{color:#555;font-size:10.5px}
  .print-pack .pp-codes td{padding:2px 12px 2px 0;font-size:12px}
  .print-pack .pp-em li{margin-bottom:4px}
}
/* budget cap */
.budget-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 14px;font-size:13px}
.budget-lbl{font-weight:700}
#budget-in{width:92px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;text-align:right}
.budget-bar{flex:1;min-width:120px;margin:0}
.budget-left{color:#4C6B23;white-space:nowrap}
.budget-left.over{color:#B3261E}
:root[data-theme="dark"] .budget-left{color:#B5CC7E}
:root[data-theme="dark"] .budget-left.over{color:#F2938C}
.budget-hint{color:var(--ink-soft);font-size:12px}
/* ticket rail on Today */
.ticket-rail{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 10px;margin-top:6px}
.ticket-card{
  flex:none;min-width:200px;max-width:260px;border:1.5px dashed var(--gold);border-radius:12px;
  padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-sm);
}
.tk-time{font-size:12px;font-weight:700;color:var(--ink-soft)}
.tk-name{font-size:14px;font-weight:700;margin:2px 0 6px}
.tk-conf{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.12em;margin-bottom:8px}
.bk-clip.has{color:#4C6B23;font-weight:700}
/* price-band filter chips */
.band-chips{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.band-chip{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
}
.band-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cur-toggle{
  font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;
  vertical-align:middle;margin-left:6px;
}
.cur-toggle:hover{border-color:var(--ink);color:var(--ink)}
/* expense summary + split */
.ex-summary{font-size:14px;margin:2px 0 10px;padding:10px 12px;border:1px dotted var(--line);border-radius:10px}
.ex-summary b{font-size:17px}
.ex-usd{color:var(--ink-soft);font-size:.85em;font-weight:600}
.ex-cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ex-settle{margin-top:8px;font-size:13px;color:#7E1024;font-weight:600}
:root[data-theme="dark"] .ex-settle{color:#E08A9A}
.ex-tag{flex:none;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
#ex-cat,#ex-payer{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12.5px}
/* packing list rows */
.pk-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--line)}
.pk-row:last-of-type{border-bottom:none}
.pk-row .t{flex:1;min-width:0}
.pk-row .t strong{font-size:13.5px}
.pk-row .t p{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}
.pk-row.done .t strong{text-decoration:line-through;color:var(--ink-soft)}
.pk-row .agent-check{margin-top:1px}
.poi-peek{text-decoration:none;font-size:12px;opacity:.75}
.poi-peek:hover{opacity:1}
/* leaflet popup gets the parchment treatment + room for place details */
.leaflet-popup-content{font-size:13px;line-height:1.5}
.live-pop b{font-size:14.5px}
.live-pop .lp-sub{color:#6F6752;font-size:12px;margin:1px 0 6px}
.live-pop .lp-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.live-pop .lp-acts button,.live-pop .lp-acts a{
  font:inherit;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;
  border:1px solid #D9D1BB;background:#FDFBF4;color:#2C281E;text-decoration:none;
}
.live-pop .lp-acts button.lp-add{background:#BE1E3C;border-color:#BE1E3C;color:#FFF7EF}
/* live-map "add a stop" search in the margin */
#live-add{display:flex;flex-direction:column;gap:6px;padding:0 6px 4px}
#live-add input{padding:7px 10px;font-size:13.5px;border-radius:8px;background:rgba(253,251,244,.94)}
#live-results{display:flex;flex-direction:column;gap:2px}
#live-results button{
  text-align:left;padding:6px 8px;border-radius:8px;font-size:13px;line-height:1.3;color:#E4D3AB;
  background:rgba(20,14,6,.45);border:1px solid rgba(233,215,171,.18);
}
#live-results button:hover{background:rgba(20,14,6,.7);color:#FFF4DC}
#live-results button small{display:block;font-size:11px;opacity:.75}
.live-tip{margin:2px 0 0;font-size:11.5px;line-height:1.35;color:rgba(233,215,171,.65)}
.map-side .chip.chip-sm{font-size:14px;padding:4px 8px 4px 20px}
.map-side .chip:disabled{opacity:.4;cursor:default}
#route-list .chip small{display:block;font-family:"Avenir Next",Avenir,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.02em;opacity:.7}
/* draggable trip pins on the live map */
.live-pin{width:18px;height:18px;border-radius:50%;background:#BE1E3C;border:2.5px solid #F3E7C9;
  box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:grab;box-sizing:border-box}
.live-pin.gw::after{content:"✈";position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:12px;color:#F3E7C9;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.leaflet-marker-dragging .live-pin{cursor:grabbing;transform:scale(1.25)}
.toast-undo{margin-left:10px;font:inherit;font-weight:700;color:var(--gold);text-decoration:underline;text-underline-offset:2px}
@media (max-width:820px){
  #route-list .chip small{display:none}
  #live-add{flex-direction:row;align-items:center;padding:0 4px}
  #live-add input{width:150px}
  #live-results{flex-direction:row}
  #live-results button small{display:none}
  .live-tip{display:none}
}
/* potential destinations */
.sl-group{padding:8px 0 2px;border-bottom:1px dotted var(--line)}
.sl-group:last-child{border-bottom:none}
.sl-group b{font-size:12.5px;letter-spacing:.02em}
.pencil-item{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.pencil-item .pi-name{flex:1;min-width:0}
.pi-when{font-style:italic;color:var(--ink-soft);font-size:12px}
.pi-dot{color:var(--gold);font-size:15px}
.pencil-item.pencilled{border-left:2px solid var(--gold);padding-left:8px;margin:2px 0}
.pencil-list{margin:6px 0 2px}
.idea-box{margin:4px 0 2px;font-size:13px}
.idea-box summary{cursor:pointer;color:var(--ink-soft);font-weight:600;padding:4px 0}
.idea-box summary:hover{color:var(--ink)}
.icon-btn.starred{color:#B8862B;border-color:#B8862B}
/* trip versions + comparison */
.var-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.var-row:last-child{border-bottom:none}
.var-row b{flex:none}
.var-meta{flex:1;color:var(--ink-soft);font-size:12px}
#dlg-compare{width:min(860px,calc(100vw - 24px))}
.cmp-scroll{overflow-x:auto}
.cmp-table{border-collapse:collapse;min-width:100%;font-size:13.5px}
.cmp-table th,.cmp-table td{padding:8px 12px;text-align:left;border-bottom:1px dotted var(--line);vertical-align:top}
.cmp-table thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.cmp-table tbody th{font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--surface)}
.cmp-table td{min-width:130px}
.cmp-table td.best{color:#4C6B23;font-weight:700}
:root[data-theme="dark"] .cmp-table td.best{color:#B5CC7E}
/* currency converter */
.fx-row{display:flex;gap:12px;align-items:center;margin:6px 0 10px}
.fx-cell{display:flex;gap:6px;align-items:center;font-weight:700;font-size:17px}
.fx-cell input{width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  font-size:16px;background:var(--surface);color:var(--ink);text-align:right}
.fx-swap{font-size:18px;color:var(--ink-soft)}
.fx-quick{display:flex;gap:8px;flex-wrap:wrap}
.fx-chip{font-size:12px;font-weight:700;background:var(--surface2);border-radius:999px;padding:3px 10px;color:var(--ink-soft)}
/* document wallet */
.doc-clip{
