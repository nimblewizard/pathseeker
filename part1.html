<title>Pathseeker · Italia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F5F1E6; --surface:#FDFBF4; --surface2:#EDE7D6; --ink:#2C281E; --ink-soft:#6F6752;
  --line:#D9D1BB; --sea:#B7CFD0; --sea-deep:#A3C0C2; --land:#E9E2C9; --land-line:#C6BC9D;
  --accent:#BE1E3C; --accent-soft:#F3D9DC; --accent-ink:#FFF7EF;
  --olive:#5F6F3E; --olive-soft:#E3E6D2; --gold:#B8862B;
  --shadow:0 10px 30px rgba(46,42,32,.16); --shadow-sm:0 2px 8px rgba(46,42,32,.10);
  --focus:#1D5FA0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1C2124; --surface2:#242A2D; --ink:#EAE3D0; --ink-soft:#A79F89;
    --line:#333B3E; --sea:#152529; --sea-deep:#0F1D21; --land:#2A2E23; --land-line:#4A4F3B;
    --accent:#E14B64; --accent-soft:#46242B; --accent-ink:#1C0C10;
    --olive:#99A75F; --olive-soft:#2A3024; --gold:#D2A24E;
    --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.4);
    --focus:#6FA8DC;
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1C2124; --surface2:#242A2D; --ink:#EAE3D0; --ink-soft:#A79F89;
  --line:#333B3E; --sea:#152529; --sea-deep:#0F1D21; --land:#2A2E23; --land-line:#4A4F3B;
  --accent:#E14B64; --accent-soft:#46242B; --accent-ink:#1C0C10;
  --olive:#99A75F; --olive-soft:#2A3024; --gold:#D2A24E;
  --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --focus:#6FA8DC;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Bodoni 72",Didot,"Bodoni MT","Playfair Display",Georgia,serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;border-radius:6px;
}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
.label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;
}
.hidden{display:none !important}
::placeholder{color:var(--ink-soft);opacity:.7}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn-quiet:hover{color:var(--ink);box-shadow:none;background:var(--surface2)}
.btn-danger{color:var(--accent);border-color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* ---------- home ---------- */
#home{
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  padding:32px 20px;position:relative;overflow:hidden;
}
#home-minimap{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.5;
}
#home-minimap svg{height:min(92vh,900px);width:auto}
.home-card{
  position:relative;width:min(430px,100%);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:32px 30px 28px;
}
.wordmark{
  font-size:44px;line-height:1;font-weight:600;letter-spacing:.01em;margin-bottom:2px;
}
.wordmark .path{color:var(--accent)}
.home-tag{
  font-style:italic;color:var(--ink-soft);margin:2px 0 24px;
  font-family:"Bodoni 72",Didot,Georgia,serif;font-size:17px;
}
.field{margin-bottom:14px}
.field .label{display:block;margin-bottom:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;
  background:var(--surface);display:flex;flex-direction:column;gap:1px;
}
.dest strong{font-size:14px}
.dest small{color:var(--ink-soft);font-size:11.5px}
.dest[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dest:disabled{opacity:.45;cursor:default}
.home-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.home-resume{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:13.5px;color:var(--ink-soft);
}

/* ---------- app shell ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.appbar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);flex:none;z-index:30;
}
.appbar .wordmark-sm{font-size:21px;font-weight:600;line-height:1}
.appbar .wordmark-sm .path{color:var(--accent)}
.trip-chip{font-size:12px;color:var(--ink-soft);line-height:1.25}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface2);border-radius:10px;padding:3px}
.tab{
  padding:7px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft);
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.sync-btn{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:8px 13px;border:1px solid var(--line);border-radius:10px;color:var(--ink-soft);
}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--olive);flex:none}
.sync-dot.dirty{background:var(--gold)}
.main{flex:1;min-height:0;position:relative}

/* ---------- map view ---------- */
#view-map{position:absolute;inset:0;display:flex}
.map-stage{flex:1;min-width:0;position:relative;background:var(--sea);overflow:hidden}
.map-stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sea-label{
  font-family:"Bodoni 72",Didot,Georgia,serif;font-style:italic;
  fill:var(--sea-deep);letter-spacing:.25em;
}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2;stroke-linejoin:round}
.graticule{stroke:var(--sea-deep);stroke-width:.6;stroke-dasharray:1 5;fill:none;opacity:.8}
.route{
  fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 5;
  stroke-linecap:round;stroke-linejoin:round;opacity:.9;
}
@media (prefers-reduced-motion: no-preference){
  .route{animation:march 40s linear infinite}
  @keyframes march{to{stroke-dashoffset:-1000}}
}
.city{cursor:pointer}
.city circle.dot{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.6}
.city.in-trip circle.dot{fill:var(--accent);stroke:var(--accent)}
.city.selected circle.halo{fill:none;stroke:var(--accent);stroke-width:1.4}
.city text{
  font-family:"Avenir Next",Avenir,system-ui,sans-serif;font-size:11.5px;font-weight:600;
  fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;
}
.city.gateway text{font-weight:700}
.city .plane{fill:var(--ink-soft);font-size:9px;font-family:inherit}
.map-hud{
  position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;
  pointer-events:none;z-index:5;flex-wrap:wrap;
}
.chips{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  box-shadow:var(--shadow-sm);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.zoom-ctl{
  position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5;
}
.zoom-ctl button{
  width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:18px;font-weight:600;box-shadow:var(--shadow-sm);color:var(--ink);
}
.map-hint{
  position:absolute;left:12px;bottom:14px;z-index:5;font-size:12px;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  box-shadow:var(--shadow-sm);
}

/* ---------- city panel ---------- */
.panel{
  position:relative;width:390px;flex:none;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:10;
}
.panel-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.panel-head .region{margin-bottom:2px}
.panel-head h2{font-size:30px;font-weight:600;line-height:1.05}
.panel-head .tagline{
  font-family:"Bodoni 72",Didot,Georgia,serif;font-style:italic;color:var(--ink-soft);
  font-size:15.5px;margin-top:4px;
}
.panel-close{position:absolute;top:14px;right:14px;font-size:20px;color:var(--ink-soft);padding:4px 8px}
.panel-status{
  margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:var(--olive-soft);color:var(--olive);
}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.panel-body{flex:1;overflow-y:auto;padding:8px 20px 20px;overscroll-behavior:contain}
.poi-section{margin-top:16px}
.poi-section > .label{display:flex;align-items:center;gap:8px}
.poi-section > .label::after{content:"";flex:1;border-top:1px solid var(--line)}
.poi{
  display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted var(--line);
}
.poi:last-child{border-bottom:none}
.poi-txt{flex:1;min-width:0}
.poi-txt strong{font-size:14.5px;font-weight:600}
.poi-txt p{margin:1px 0 0;font-size:13px;color:var(--ink-soft)}
.poi-txt .cat{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.poi-acts{display:flex;gap:4px;flex:none;margin-top:2px}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-soft);font-size:14px;text-decoration:none;
}
.icon-btn:hover{color:var(--ink);box-shadow:var(--shadow-sm)}
.panel-cta{
  padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface);
}
.panel-cta .btn{flex:1}
.book-block{
  margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  background:var(--surface2);
}
.book-block .label{display:block;margin-bottom:8px}
.book-row{display:flex;gap:7px;flex-wrap:wrap}
.book-row .btn{flex:1;min-width:90px;text-decoration:none;background:var(--surface)}
.book-block .after{
  margin:10px 0 0;font-size:12.5px;color:var(--ink-soft);
}
.book-block .after button{
  color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;
}
.travel-note{
  margin-top:16px;background:var(--surface2);border-radius:10px;padding:11px 13px;
  font-size:13px;color:var(--ink-soft);
}
.travel-note b{color:var(--ink)}

/* ---------- itinerary ---------- */
#view-itin,#view-journal,#view-today,#view-translate{position:absolute;inset:0;overflow-y:auto}
/* ---------- translate ---------- */
.phrase{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line)}
.phrase:last-child{border-bottom:none}
.phrase .p-txt{flex:1;min-width:0}
.phrase .p-it{font-weight:700;font-size:15px}
.phrase .p-en{font-size:12.5px;color:var(--ink-soft)}
.menu-term{display:flex;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px dotted var(--line);align-items:baseline}
.menu-term:last-child{border-bottom:none}
.menu-term b{flex:none;min-width:118px}
.menu-term span{color:var(--ink-soft)}
.tr-search{margin:14px 0 18px}
.tr-search input{font-size:16px;padding:12px 14px;border-radius:12px}
.sheet-wrap{max-width:860px;margin:0 auto;padding:26px 20px 80px}
.view-title{font-size:34px;font-weight:600;margin-bottom:4px}
.view-sub{color:var(--ink-soft);margin:0 0 22px;font-size:14.5px}
.day-row{
  display:grid;grid-template-columns:86px 1fr;gap:16px;padding:14px 0;
  border-top:1px solid var(--line);
}
.day-date{text-align:right}
.day-date .dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.day-date .num{font-size:24px;font-weight:600;line-height:1.1}
.day-date .mon{font-size:12px;color:var(--ink-soft)}
.day-city{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.day-city .name{font-weight:700;font-size:15.5px}
.day-city .transfer{color:var(--accent);font-weight:600;font-size:13px}
.day-city .unassigned{color:var(--ink-soft);font-style:italic;font-size:13.5px}
.day-items{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.bk{
  display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13.5px;cursor:pointer;
}
.bk:hover{box-shadow:var(--shadow-sm)}
.bk .type-dot{width:9px;height:9px;border-radius:50%;flex:none}
.bk .bk-name{font-weight:600}
.bk .bk-meta{color:var(--ink-soft);font-size:12.5px}
.bk .spacer{flex:1}
.bk a{color:var(--ink-soft);text-decoration:none;font-size:13px}
.day-add{margin-top:7px}
.stop-card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.stop-card .n{font-size:18px;font-weight:700}
.stop-card .d{color:var(--ink-soft);font-size:13.5px}
.stop-card .spacer{flex:1}
.empty{
  border:1.5px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;
  color:var(--ink-soft);font-size:14px;
}

/* ---------- journal ---------- */
.j-group{margin-bottom:26px}
.j-city-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.j-city-head h3{font-size:22px;font-weight:600}
.j-city-head .d{color:var(--ink-soft);font-size:13px}
.j-note{
  background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:6px;
  display:flex;gap:10px;align-items:baseline;
}
.j-note .jd{flex:none;font-size:12px;color:var(--ink-soft)}
.j-note .spacer{flex:1}
.journal-form{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:24px;display:grid;gap:10px;
}
.journal-form .row{display:grid;grid-template-columns:150px 1fr auto;gap:10px}

/* ---------- today ---------- */
.t-transfer{
  background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 16px;
  font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  font-size:14px;
}
.t-transfer a{color:inherit}
.t-count{font-size:64px;font-weight:600;line-height:1}
.t-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.t-card .label{display:block;margin-bottom:7px}
.t-card .big{font-size:19px;font-weight:700}
.t-card p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}
.t-card .t-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.quick-row input{width:auto;flex:1;min-width:150px}
.ess{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 18px 10px}
.ess summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:15px}
.ess h4{margin:14px 0 4px;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.ess p,.ess li{font-size:13.5px;color:var(--ink-soft);margin:2px 0}
.ess ul{margin:4px 0;padding-left:18px}
.ess b{color:var(--ink)}
.exp-row{display:flex;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.exp-row .d{color:var(--ink-soft);flex:none;font-size:12px;width:56px}
.exp-row .lbl{flex:1;min-width:0}
.exp-row .amt{font-weight:700;font-variant-numeric:tabular-nums}
.transfer-chip{
  display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;margin-top:6px;
}
.transfer-chip a{color:inherit}

/* ---------- trip mode & photos ---------- */
.day-nav{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.day-nav .arrow{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font-size:17px;font-weight:700;color:var(--ink);
}
.day-nav .arrow:disabled{opacity:.35;cursor:default}
.day-nav .day-sub{color:var(--ink-soft);font-size:14.5px}
.day-scrub{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;
  display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px 6px;box-shadow:var(--shadow-sm);
}
.day-scrub button{
  width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:700;color:var(--ink);
}
.day-scrub button:disabled{opacity:.3;cursor:default}
.day-scrub .ds-label{font-size:12.5px;font-weight:700;padding:0 8px;white-space:nowrap}
.city.visited circle.dot{fill:var(--olive);stroke:var(--olive)}
.city.current circle.dot{fill:var(--accent);stroke:var(--accent)}
.city.current circle.halo{fill:none;stroke:var(--accent);stroke-width:1.6}
@media (prefers-reduced-motion: no-preference){
  .city.current circle.halo{animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{r:7;opacity:.9}70%{r:16;opacity:0}100%{r:16;opacity:0}}
}
.route-done{
  fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
}
.pbadge circle{fill:var(--gold);stroke:var(--surface);stroke-width:1.4}
.pbadge text{fill:var(--surface);font-size:8.5px;font-weight:700;font-family:inherit;stroke:none}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
.photo-thumb{
  aspect-ratio:1;object-fit:cover;width:100%;border-radius:9px;cursor:pointer;display:block;
  border:1px solid var(--line);
}
#dlg-photo{width:min(560px,calc(100vw - 24px))}
#ph-img{width:100%;max-height:58vh;object-fit:contain;display:block;background:#101010;border-radius:16px 16px 0 0}

/* ---------- dialogs ---------- */
dialog{
  border:none;border-radius:16px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);padding:0;width:min(430px,calc(100vw - 32px));
}
dialog::backdrop{background:rgba(20,18,12,.45);backdrop-filter:blur(2px)}
.dlg-head{padding:18px 22px 0}
.dlg-head h3{font-size:23px;font-weight:600}
.dlg-head p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px}
.dlg-body{padding:16px 22px;display:grid;gap:12px}
.dlg-foot{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.type-opt{
